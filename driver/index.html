<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trollhättan Cab — Förarapp</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0d1b3e;color:white;min-height:100vh}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}
#sLoad{background:#0d1b3e;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.load-logo{font-size:56px;animation:bounce 1s infinite}
.load-name{color:#fbbf24;font-size:20px;font-weight:bold;letter-spacing:2px;text-align:center}
.load-sub{color:#4a6090;font-size:13px}
.dots{display:flex;gap:8px;margin-top:12px}
.dot{width:10px;height:10px;background:#fbbf24;border-radius:50%;animation:dp 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes dp{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
#sLogin{background:#0d1b3e;padding:30px 24px;align-items:center;justify-content:center}
.login-wrap{width:100%;max-width:400px}
.login-logo{text-align:center;margin-bottom:32px}
.login-icon{font-size:48px}
.login-name{font-size:22px;font-weight:bold;color:#fbbf24;letter-spacing:2px;margin-top:6px}
.login-sub{color:#4a6090;font-size:13px;margin-top:4px}
.login-box{background:#1a2f5e;border-radius:16px;padding:24px;border:1px solid #2a4080}
.flabel{font-size:11px;font-weight:700;color:#4a6090;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;display:block}
.finput{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #2a4080;background:#0d1b3e;color:white;font-size:15px;outline:none;box-sizing:border-box;margin-bottom:14px}
.finput:focus{border-color:#fbbf24}
.finput::placeholder{color:#2a4080}
.err-box{background:#fee2e2;color:#dc2626;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none;font-weight:600}
.topbar{background:#0d1b3e;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1a2f5e;position:sticky;top:0;z-index:100}
.tlogo{color:#fbbf24;font-size:15px;font-weight:bold}
.status-badge{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;border:none;cursor:default}
.sb-ledig{background:#15803d;color:white}
.sb-uppdrag{background:#1a56db;color:white}
.sb-paus{background:#d97706;color:white}
.sb-blockerad{background:#dc2626;color:white}
.sb-offline{background:#334155;color:#94a3b8}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#0d1b3e;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #1a2f5e;z-index:100}
.bni{display:flex;flex-direction:column;align-items:center;gap:3px;color:#4a6090;font-size:10px;cursor:pointer;border:none;background:none;padding:4px 8px}
.bni.on{color:#fbbf24}
.bni-icon{font-size:20px}
.page{padding:20px;background:#eef1f8;color:#0d1b3e;flex:1;overflow-y:auto}
.card{background:white;border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid #d0d7ea}
.stitle{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
.btn{padding:14px;border-radius:10px;font-size:15px;font-weight:700;border:none;cursor:pointer;width:100%;text-align:center}
.btn:disabled{opacity:.6;cursor:default}
.btn-primary{background:#0d1b3e;color:#fbbf24}
.btn-success{background:#15803d;color:white}
.btn-danger{background:#dc2626;color:white}
.btn-gray{background:#f1f5f9;color:#64748b}
.btn-blue{background:#1a56db;color:white}
.btn-yellow{background:#fbbf24;color:#0d1b3e}
.btn-orange{background:#d97706;color:white}
.btn-sm{padding:8px 16px;font-size:13px;width:auto;border-radius:8px;display:inline-block}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.b-green{background:#dcfce7;color:#15803d;border:1px solid #86efac}
.b-gray{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0}
.b-blue{background:#dbeafe;color:#1a56db;border:1px solid #93c5fd}
.b-orange{background:#fef3c7;color:#d97706;border:1px solid #fde68a}
.booking-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.booking-overlay.show{display:flex}
.booking-popup{background:white;border-radius:20px;padding:24px;width:100%;max-width:420px;color:#0d1b3e}
.popup-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.popup-new{background:#dc2626;color:white;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.popup-timer{font-size:36px;font-weight:800;color:#dc2626;font-family:monospace}
.popup-timer.urgent{color:#dc2626;animation:blink .5s infinite}
.popup-route{font-size:16px;font-weight:700;color:#0d1b3e;margin-bottom:6px}
.popup-detail{font-size:13px;color:#64748b;margin-bottom:10px}
.popup-fare{font-size:36px;font-weight:800;color:#0d1b3e;margin-bottom:14px}
.popup-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.popup-accept{background:#15803d;color:white;border:none;border-radius:12px;padding:18px;font-size:17px;font-weight:800;cursor:pointer;animation:pulse-green 1.5s infinite}
@keyframes pulse-green{0%,100%{box-shadow:0 0 0 0 rgba(21,128,61,.5)}50%{box-shadow:0 0 0 14px rgba(21,128,61,0)}}
.popup-decline{background:#fee2e2;color:#dc2626;border:2px solid #fecaca;border-radius:12px;padding:18px;font-size:17px;font-weight:700;cursor:pointer}
.moverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:flex-end;justify-content:center}
.moverlay.open{display:flex}
.mbox{background:white;border-radius:20px 20px 0 0;padding:24px 20px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto;color:#0d1b3e}
.mtitle{font-size:17px;font-weight:bold;color:#0d1b3e;margin-bottom:16px}
.chatbox{height:220px;overflow-y:auto;padding:8px 0;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.cmsg{display:flex;gap:8px;align-items:flex-end}
.cmsg.mine{flex-direction:row-reverse}
.cav{width:28px;height:28px;border-radius:50%;background:#0d1b3e;color:#fbbf24;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;flex-shrink:0}
.cav.other{background:#7c3aed}
.cbubble{max-width:72%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.4}
.cmsg.mine .cbubble{background:#0d1b3e;color:#fbbf24;border-radius:12px 12px 4px 12px}
.cmsg.other .cbubble{background:#f1f5f9;color:#0d1b3e;border-radius:12px 12px 12px 4px}
.cinput-row{display:flex;gap:8px}
.cinput{flex:1;padding:9px 12px;border-radius:24px;border:1px solid #d0d7ea;background:#f8fafc;font-size:13px;color:#0d1b3e;outline:none}
.csend{width:38px;height:38px;border-radius:50%;background:#0d1b3e;border:none;color:#fbbf24;font-size:15px;cursor:pointer;flex-shrink:0}
.toast{position:fixed;bottom:90px;left:20px;right:20px;padding:14px 20px;border-radius:12px;font-size:14px;font-weight:bold;text-align:center;z-index:400;display:none;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.toast.show{display:block}
.ib{border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:10px}
.ib-yellow{background:#fef3c7;border:1px solid #fde68a;color:#d97706}
.ib-blue{background:#dbeafe;border:1px solid #93c5fd;color:#1a56db}
.ib-red{background:#fee2e2;border:1px solid #fecaca;color:#dc2626}
.driver-header{background:linear-gradient(135deg,#0d1b3e,#1a3066);padding:24px 20px;display:flex;align-items:center;gap:16px}
.driver-avatar{width:60px;height:60px;border-radius:50%;background:#fbbf24;color:#0d1b3e;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;flex-shrink:0}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f8fafc}
.list-item:last-child{border-bottom:none}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat-box{background:#1a2f5e;border-radius:10px;padding:12px 8px;text-align:center}
.stat-val{font-size:18px;font-weight:800;color:#fbbf24}
.stat-lbl{font-size:10px;color:#4a6090;margin-top:2px}
.driver-map{background:#d4e8d4;border-radius:12px;height:160px;position:relative;overflow:hidden;margin-bottom:14px;border:1px solid #b8d4b8}
.map-bg{position:absolute;inset:0;background-image:linear-gradient(#b8d4b8 1px,transparent 1px),linear-gradient(90deg,#b8d4b8 1px,transparent 1px);background-size:25px 25px;opacity:.5}
.map-road-h{position:absolute;height:5px;background:white;left:0;right:0;opacity:.8}
.map-road-v{position:absolute;width:5px;background:white;top:0;bottom:0;opacity:.8}
.my-marker{position:absolute;width:40px;height:40px;border-radius:50%;background:#0d1b3e;border:4px solid #fbbf24;display:flex;align-items:center;justify-content:center;font-size:18px;transform:translate(-50%,-50%);transition:left 1s,top 1s}
.map-gps{position:absolute;bottom:8px;left:8px;background:rgba(13,27,62,.9);color:#fbbf24;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:bold}
.trip-card{background:white;border-radius:12px;padding:16px;margin-bottom:10px;border:1px solid #d0d7ea}
.trip-active{border-color:#15803d;box-shadow:0 0 0 3px #dcfce7}
.paus-screen{background:linear-gradient(135deg,#92400e,#d97706);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
.block-screen{background:linear-gradient(135deg,#7f1d1d,#dc2626);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:600;align-items:center;justify-content:center;padding:24px}
.confirm-overlay.open{display:flex}
.confirm-box{background:white;border-radius:16px;padding:28px 24px;width:100%;max-width:380px;color:#0d1b3e;text-align:center}
</style>
</head>
<body>

<div class="screen active" id="sLoad">
  <div class="load-logo">🚖</div>
  <div class="load-name">TROLLHÄTTAN CAB</div>
  <div class="load-sub">Förarapp</div>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>

<div class="screen" id="sLogin">
  <div class="login-wrap">
    <div class="login-logo">
      <div class="login-icon">🚖</div>
      <div class="login-name">TROLLHÄTTAN CAB</div>
      <div class="login-sub">Förarapp — Driver Portal</div>
    </div>
    <div class="login-box">
      <label class="flabel">E-postadress</label>
      <input class="finput" id="loginEmail" type="email" placeholder="din@email.se" onkeydown="if(event.key==='Enter')doLogin()"/>
      <label class="flabel">Lösenord</label>
      <input class="finput" id="loginPassword" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
      <div class="err-box" id="loginErr"></div>
      <button class="btn btn-yellow" id="loginBtn" onclick="doLogin()">Logga in →</button>
    </div>
    <div style="text-align:center;margin-top:20px;font-size:12px;color:#4a6090">
      Trollhättan Cab AB · Org.nr 559312-7128<br>
      <span style="margin-top:6px;display:block">Problem att logga in? Kontakta central.</span>
    </div>
  </div>
</div>

<div class="screen" id="sApp">
  <div class="topbar">
    <div class="tlogo">🚖 THTCab</div>
    <div class="status-badge" id="statusBadge">⚫ Offline</div>
  </div>
  <div style="flex:1;overflow-y:auto;background:#eef1f8" id="tabContent"></div>
  <div class="bnav">
    <button class="bni on" id="bni0" onclick="showTab(0)"><span class="bni-icon">🏠</span><span>Hem</span></button>
    <button class="bni" id="bni1" onclick="showTab(1)"><span class="bni-icon">📋</span><span>Resor</span></button>
    <button class="bni" id="bni2" onclick="showTab(2)"><span class="bni-icon">💬</span><span>Chatt</span></button>
    <button class="bni" id="bni3" onclick="showTab(3)"><span class="bni-icon">👤</span><span>Profil</span></button>
  </div>
</div>

<!-- INCOMING BOOKING OVERLAY -->
<div class="booking-overlay" id="bookingOverlay">
  <div class="booking-popup">
    <div class="popup-header">
      <div>
        <div class="popup-new">🚨 NY BOKNING!</div>
        <div style="font-size:12px;color:#64748b;margin-top:4px" id="popupRef"></div>
      </div>
      <div class="popup-timer" id="popupTimer">30</div>
    </div>
    <div id="popupPreBadge" style="display:none;margin-bottom:8px">
      <span class="badge b-blue">📅 Förbokning</span>
      <span style="font-size:12px;color:#7c3aed;margin-left:6px" id="popupPreTime"></span>
    </div>
    <div class="popup-route" id="popupRoute"></div>
    <div class="popup-detail" id="popupDetail"></div>
    <div class="popup-fare" id="popupFare"></div>
    <div class="ib ib-blue" id="popupPayment" style="margin-bottom:16px"></div>
    <div class="popup-btns">
      <button class="popup-decline" onclick="declineBooking()">✕ Neka</button>
      <button class="popup-accept" onclick="acceptBooking()">✓ Acceptera</button>
    </div>
  </div>
</div>

<!-- LOGOUT CONFIRM -->
<div class="confirm-overlay" id="logoutConfirm">
  <div class="confirm-box">
    <div style="font-size:40px;margin-bottom:12px">🚪</div>
    <div style="font-size:18px;font-weight:bold;color:#0d1b3e;margin-bottom:8px">Logga ut?</div>
    <div style="font-size:14px;color:#64748b;margin-bottom:24px">Du sätts som offline och kan inte ta emot bokningar.</div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-gray" style="flex:1" onclick="document.getElementById('logoutConfirm').classList.remove('open')">Avbryt</button>
      <button class="btn btn-danger" style="flex:1" onclick="confirmLogout()">Logga ut</button>
    </div>
  </div>
</div>

<!-- CHAT MODAL -->
<div class="moverlay" id="chatModal">
  <div class="mbox">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="mtitle" id="chatTitle" style="margin-bottom:0">Chatt</div>
      <button onclick="closeMod('chatModal')" style="background:none;border:none;font-size:22px;cursor:pointer;color:#64748b">✕</button>
    </div>
    <div class="chatbox" id="chatMessages"></div>
    <div class="cinput-row">
      <input class="cinput" id="chatInput" placeholder="Skriv meddelande..." onkeydown="if(event.key==='Enter')sendChat()"/>
      <button class="csend" onclick="sendChat()">➤</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://16.16.153.106.sslip.io';

let driver = null;
let token = null;
let activeBooking = null;
let myTrips = [];
let curTab = 0;
let socket = null;
let currentLat = 58.2837;
let currentLng = 12.2878;
let popupTimerInterval = null;
let pendingBooking = null;
let currentChatKey = null;
let audioCtx = null;
let workStartTime = null;
let onlineSeconds = 0;
let onlineTimer = null;
let pauseStartTime = null;
let pauseSeconds = 0;
let pauseTimer = null;
let isPaused = false;
let blockTimer = null;
let driverStatus = 'available'; // available, busy, paused, blocked, offline

function initAudio(){
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
}
document.addEventListener('touchstart',initAudio,{passive:true});
document.addEventListener('click',initAudio);

function playAlert(){
  try{
    initAudio();if(!audioCtx)return;
    if(audioCtx.state==='suspended')audioCtx.resume();
    const beep=(freq,start,dur)=>{
      const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();
      osc.connect(gain);gain.connect(audioCtx.destination);
      osc.frequency.value=freq;osc.type='sine';
      gain.gain.setValueAtTime(1.0,audioCtx.currentTime+start);
      gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+start+dur);
      osc.start(audioCtx.currentTime+start);osc.stop(audioCtx.currentTime+start+dur);
    };
    beep(880,.0,.15);beep(660,.2,.15);beep(880,.4,.15);beep(660,.6,.15);beep(880,.8,.4);
    beep(1100,1.3,.15);beep(880,1.5,.15);beep(1100,1.7,.15);beep(880,1.9,.15);beep(1100,2.1,.6);
  }catch(e){}
}

function vibrateAlert(){try{if('vibrate' in navigator)navigator.vibrate([800,200,400,200,800,200,400,200,800]);}catch(e){}}

function sendPushNotif(title,body){
  try{if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body,tag:'thtcab-booking',requireInteraction:true});}catch(e){}
}

function showToast(msg,bg,fg){
  try{const el=document.getElementById('toast');el.textContent=msg;el.style.background=bg||'#fbbf24';el.style.color=fg||'#0d1b3e';el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3500);}catch(e){}
}

function closeMod(id){try{document.getElementById(id).classList.remove('open');}catch(e){}}

function updateStatusBadge(){
  const el=document.getElementById('statusBadge');if(!el)return;
  if(driverStatus==='available'){el.className='status-badge sb-ledig';el.textContent='🟢 Ledig';}
  else if(driverStatus==='busy'){el.className='status-badge sb-uppdrag';el.textContent='🟠 På uppdrag';}
  else if(driverStatus==='paused'){el.className='status-badge sb-paus';el.textContent='🟡 Paus';}
  else if(driverStatus==='blocked'){el.className='status-badge sb-blockerad';el.textContent='🔴 Blockerad';}
  else{el.className='status-badge sb-offline';el.textContent='⚫ Offline';}
}

window.addEventListener('load',()=>{
  setTimeout(()=>{
    try{
      const saved=localStorage.getItem('thtcab_driver');
      const savedTok=localStorage.getItem('thtcab_driver_token');
      if(saved&&savedTok){
        driver=JSON.parse(saved);token=savedTok;
        // Restore state
        const savedBooking=localStorage.getItem('thtcab_active_booking');
        if(savedBooking)try{activeBooking=JSON.parse(savedBooking);}catch(e){}
        const savedOnline=localStorage.getItem('thtcab_online_seconds');
        if(savedOnline)onlineSeconds=parseInt(savedOnline)||0;
        // Check if block is still active
        const blockUntil=localStorage.getItem('thtcab_block_until');
        if(blockUntil){
          const remaining=Math.floor((new Date(blockUntil)-Date.now())/1000);
          if(remaining>0){driverStatus='blocked';showBlockedScreen(remaining);enterApp();return;}
        }
        // Check if was paused
        const pausedAt=localStorage.getItem('thtcab_paused_at');
        if(pausedAt){
          isPaused=true;driverStatus='paused';
          pauseSeconds=Math.floor((Date.now()-parseInt(pausedAt))/1000);
          pauseStartTime=parseInt(pausedAt);
          startPauseTimer();
        }
        driverStatus=activeBooking?'busy':'available';
        if(isPaused)driverStatus='paused';
        enterApp();
      }else{showScreen('sLogin');}
    }catch(e){showScreen('sLogin');}
  },2000);
});

function showScreen(id){
  try{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));const el=document.getElementById(id);if(el)el.classList.add('active');}catch(e){}
}

async function doLogin(){
  const emailEl=document.getElementById('loginEmail');const pwdEl=document.getElementById('loginPassword');
  const err=document.getElementById('loginErr');const btn=document.getElementById('loginBtn');
  const email=emailEl.value.trim().toLowerCase();const password=pwdEl.value.trim();
  err.style.display='none';
  if(!email||!password){err.textContent='⚠️ Fyll i e-post och lösenord';err.style.display='';return;}
  btn.textContent='Loggar in...';btn.disabled=true;
  try{
    const res=await fetch(API+'/drivers/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await res.json();
    if(data.token){
      driver=data.driver;token=data.token;
      driver.trips_today=driver.trips_today||0;driver.earnings_today=driver.earnings_today||0;
      localStorage.setItem('thtcab_driver',JSON.stringify(driver));
      localStorage.setItem('thtcab_driver_token',token);
      driverStatus='available';
      enterApp();
    }else{err.textContent='⚠️ '+(data.error||'Fel e-post eller lösenord');err.style.display='';}
  }catch(e){err.textContent='⚠️ Kunde inte ansluta';err.style.display='';}
  btn.textContent='Logga in →';btn.disabled=false;
}

function enterApp(){
  showScreen('sApp');
  updateStatusBadge();
  startGPS();
  startWorkTimer();
  if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
  setTimeout(()=>{connectSocket();},1500);
  showTab(0);
}

function startWorkTimer(){
  if(onlineTimer)clearInterval(onlineTimer);
  onlineTimer=setInterval(()=>{
    onlineSeconds++;
    localStorage.setItem('thtcab_online_seconds',onlineSeconds);
    updateWorkTimer();
  },1000);
}

function updateWorkTimer(){
  const el=document.getElementById('workTimer');if(!el)return;
  const h=Math.floor(onlineSeconds/3600);const m=Math.floor((onlineSeconds%3600)/60);const s=onlineSeconds%60;
  el.textContent=(h>0?h+'h ':'')+m+'m '+s+'s';
}

function startPauseTimer(){
  if(pauseTimer)clearInterval(pauseTimer);
  pauseTimer=setInterval(()=>{
    pauseSeconds++;
    updatePauseTimer();
  },1000);
}

function updatePauseTimer(){
  const el=document.getElementById('pauseTimer');if(!el)return;
  const h=Math.floor(pauseSeconds/3600);const m=Math.floor((pauseSeconds%3600)/60);const s=pauseSeconds%60;
  el.textContent=(h>0?h+'h ':'')+m+'m '+s+'s';
}

function startGPS(){
  if('geolocation' in navigator){
    navigator.geolocation.watchPosition(pos=>{
      currentLat=pos.coords.latitude;currentLng=pos.coords.longitude;
      if(driverStatus==='available'||driverStatus==='busy')sendGPS();
      updateMapMarker();
    },err=>console.log('GPS:',err.message),{enableHighAccuracy:true,maximumAge:5000,timeout:10000});
  }
  setInterval(()=>{
    currentLat+=(Math.random()-0.5)*0.001;currentLng+=(Math.random()-0.5)*0.001;
    if(driverStatus==='available'||driverStatus==='busy'){sendGPS();updateMapMarker();}
  },5000);
}

function sendGPS(){if(socket)socket.emit('driver:location',{driverId:parseInt(driver.id),lat:currentLat,lng:currentLng});}

function updateMapMarker(){
  const m=document.getElementById('myMarker');if(!m)return;
  const x=((currentLng-12.1)/(12.5-12.1))*80+10;
  const y=((58.4-currentLat)/(58.4-58.1))*80+10;
  m.style.left=Math.min(90,Math.max(10,x))+'%';m.style.top=Math.min(90,Math.max(10,y))+'%';
}

function connectSocket(){
  try{
    if(typeof io==='undefined'){setTimeout(connectSocket,1000);return;}
    socket=io(API,{timeout:5000});
    socket.on('connect',()=>{
      socket.emit('driver:join',parseInt(driver.id));
      if(socket&&driverStatus!=='offline')socket.emit('driver:status',{driverId:parseInt(driver.id),status:driverStatus==='available'?'available':'busy'});
    });
    socket.on('booking:assigned:driver',(booking)=>{
      if(activeBooking&&activeBooking.id===booking.id)return;
      triggerAlert(booking);
    });
    socket.on('booking:cancelled',(data)=>{
      if(activeBooking&&activeBooking.id===data.id){
        activeBooking=null;localStorage.removeItem('thtcab_active_booking');
        driverStatus='available';updateStatusBadge();
        showToast('⚠️ Bokning avbokad av kund','#d97706','white');showTab(0);
      }
    });
    socket.on('driver:unblocked',()=>{
      driverStatus='available';updateStatusBadge();
      localStorage.removeItem('thtcab_block_until');
      showToast('✅ Du är ledig igen — redo för bokningar','#15803d','white');
      showTab(0);
    });
  }catch(e){console.log('Socket error:',e);}
}

function triggerAlert(booking){
  playAlert();vibrateAlert();
  sendPushNotif('🚨 Ny bokning! '+booking.booking_ref,'📍 '+booking.from_address+' → '+booking.to_address+' · '+booking.fare_sek+' kr');
  showPopup(booking);
}

function showPopup(booking){
  pendingBooking=booking;let countdown=30;
  document.getElementById('popupRef').textContent=booking.booking_ref;
  document.getElementById('popupRoute').textContent='📍 '+booking.from_address+' → 🏁 '+booking.to_address;
  document.getElementById('popupDetail').textContent='👤 '+booking.customer_name+' · '+(booking.customer_phone||'');
  document.getElementById('popupFare').textContent=booking.fare_sek+' kr';
  const pm={swish:'📱 Swish',card:'💳 Kort',invoice:'📄 Faktura'};
  document.getElementById('popupPayment').textContent='Betalning: '+(pm[booking.payment_method]||booking.payment_method);
  const preBadge=document.getElementById('popupPreBadge');
  if(booking.booking_type==='pre'&&booking.scheduled_at){preBadge.style.display='';document.getElementById('popupPreTime').textContent=new Date(booking.scheduled_at).toLocaleString('sv-SE',{dateStyle:'medium',timeStyle:'short'});}
  else{preBadge.style.display='none';}
  const timerEl=document.getElementById('popupTimer');
  timerEl.textContent=countdown;timerEl.classList.remove('urgent');
  document.getElementById('bookingOverlay').classList.add('show');
  if(popupTimerInterval)clearInterval(popupTimerInterval);
  popupTimerInterval=setInterval(()=>{
    countdown--;
    if(timerEl)timerEl.textContent=countdown;
    if(countdown<=10&&timerEl)timerEl.classList.add('urgent');
    if(countdown<=0){clearInterval(popupTimerInterval);declineBooking();}
  },1000);
}

async function acceptBooking(){
  if(!pendingBooking)return;
  clearInterval(popupTimerInterval);
  document.getElementById('bookingOverlay').classList.remove('show');
  try{
    const res=await fetch(API+'/bookings/'+pendingBooking.id+'/assign',{
      method:'PATCH',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({driver_id:parseInt(driver.id)})
    });
    if(res.ok){
      activeBooking={...pendingBooking};
      localStorage.setItem('thtcab_active_booking',JSON.stringify(activeBooking));
      pendingBooking=null;driverStatus='busy';updateStatusBadge();
      showToast('✅ Bokning accepterad!','#15803d','white');showTab(1);
    }else{showToast('⚠️ Kunde inte acceptera','#dc2626','white');}
  }catch(e){showToast('⚠️ Nätverksfel','#dc2626','white');}
}

async function declineBooking(){
  clearInterval(popupTimerInterval);
  document.getElementById('bookingOverlay').classList.remove('show');
  if(!pendingBooking)return;
  const bookingId=pendingBooking.id;
  const driverId=parseInt(driver.id);
  pendingBooking=null;
  try{
    await fetch(API+'/bookings/'+bookingId+'/decline',{
      method:'PATCH',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({driver_id:driverId})
    });
  }catch(e){console.log('Decline error:',e);}
  driverStatus='blocked';updateStatusBadge();
  const blockUntil=new Date(Date.now()+2*60*1000);
  localStorage.setItem('thtcab_block_until',blockUntil.toISOString());
  showBlockedScreen(120);
}

function showBlockedScreen(initialSeconds){
  let secs=initialSeconds||120;
  const c=document.getElementById('tabContent');
  if(!c)return;
  c.innerHTML='<div class="block-screen">'+
    '<div style="font-size:56px;margin-bottom:16px">⛔</div>'+
    '<div style="font-size:20px;font-weight:800;color:white;margin-bottom:8px">Du nekade en bokning</div>'+
    '<div style="font-size:14px;color:rgba(255,255,255,.7);margin-bottom:32px">Du är tillfälligt blockerad</div>'+
    '<div style="font-size:72px;font-weight:800;color:white;font-family:monospace" id="blockTimerEl">'+formatTime(secs)+'</div>'+
    '<div style="font-size:14px;color:rgba(255,255,255,.7);margin-top:16px">Du kan ta emot bokningar igen när timern är klar</div>'+
    '</div>';
  if(blockTimer)clearInterval(blockTimer);
  blockTimer=setInterval(()=>{
    secs--;
    const el=document.getElementById('blockTimerEl');
    if(el)el.textContent=formatTime(secs);
    if(secs<=0){
      clearInterval(blockTimer);
      driverStatus='available';updateStatusBadge();
      localStorage.removeItem('thtcab_block_until');
      showToast('✅ Du är ledig igen!','#15803d','white');
      showTab(0);
    }
  },1000);
}

function formatTime(secs){
  const m=Math.floor(secs/60);const s=secs%60;
  return m+':'+(s<10?'0':'')+s;
}

function startPause(){
  if(activeBooking){showToast('⚠️ Du kan inte ta paus under ett uppdrag','#dc2626','white');return;}
  isPaused=true;driverStatus='paused';
  pauseStartTime=Date.now();pauseSeconds=0;
  localStorage.setItem('thtcab_paused_at',pauseStartTime.toString());
  if(socket)socket.emit('driver:status',{driverId:parseInt(driver.id),status:'paused'});
  updateStatusBadge();startPauseTimer();
  showTab(0);
}

function endPause(){
  isPaused=false;driverStatus='available';
  if(pauseTimer)clearInterval(pauseTimer);
  const totalPause=pauseSeconds;
  pauseSeconds=0;pauseStartTime=null;
  localStorage.removeItem('thtcab_paused_at');
  if(socket)socket.emit('driver:status',{driverId:parseInt(driver.id),status:'available'});
  updateStatusBadge();
  const h=Math.floor(totalPause/3600);const m=Math.floor((totalPause%3600)/60);
  showToast('✅ Paus avslutad — '+(h>0?h+'h ':'')+m+' min','#15803d','white');
  showTab(0);
}

function showTab(i){
  try{
    if(driverStatus==='blocked')return;
    curTab=i;document.querySelectorAll('.bni').forEach((b,j)=>b.classList.toggle('on',i===j));
    const c=document.getElementById('tabContent');if(!c)return;
    if(i===0)c.innerHTML=tabHome();
    else if(i===1)c.innerHTML=tabTrips();
    else if(i===2)c.innerHTML=tabChat();
    else if(i===3)c.innerHTML=tabProfile();
  }catch(e){console.log('showTab error:',e);}
}

async function completeTrip(){
  if(!activeBooking)return;
  const fare=activeBooking.fare_sek||0;const bookingId=activeBooking.id;
  showToast('⏳ Slutför resa...','#0d9488','white');
  try{
    const res=await fetch(API+'/bookings/'+bookingId+'/complete',{
      method:'PATCH',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({driver_id:parseInt(driver.id),fare:fare})
    });
    if(res.ok){
      myTrips.unshift({...activeBooking,status:'completed'});
      driver.earnings_today=(driver.earnings_today||0)+fare;
      driver.trips_today=(driver.trips_today||0)+1;
      localStorage.setItem('thtcab_driver',JSON.stringify(driver));
      activeBooking=null;localStorage.removeItem('thtcab_active_booking');
      driverStatus='available';updateStatusBadge();
      if(socket)socket.emit('driver:status',{driverId:parseInt(driver.id),status:'available'});
      showToast('✅ Resa slutförd! +'+fare+' kr','#15803d','white');showTab(0);
    }else{showToast('⚠️ Kunde inte slutföra','#dc2626','white');}
  }catch(e){showToast('⚠️ Nätverksfel','#dc2626','white');}
}

function openChat(key,name){
  currentChatKey=key;

  document.getElementById('chatMessages').innerHTML='<div style="text-align:center;color:#94a3b8;font-size:12px;padding:20px">Laddar...</div>';
  document.getElementById('chatModal').classList.add('open');
  loadChatMessages(key);
}

async function loadChatMessages(key){
  try{
    const res=await fetch(API+'/messages/'+key);const data=await res.json();const msgs=data.messages||[];
    const el=document.getElementById('chatMessages');
    if(!msgs.length){el.innerHTML='<div style="text-align:center;color:#94a3b8;font-size:12px;padding:20px">Inga meddelanden</div>';return;}
    el.innerHTML=msgs.map(m=>{const mine=m.sender_role==='driver';
      return '<div class="cmsg '+(mine?'mine':'other')+'">'+
        '<div class="cav '+(mine?'':'other')+'">'+(m.sender_name?.charAt(0)||'?')+'</div>'+
        '<div style="max-width:72%"><div style="font-size:10px;color:#94a3b8;margin-bottom:2px;text-align:'+(mine?'right':'left')+'">'+m.sender_name+'</div>'+
        '<div class="cbubble">'+m.content+'</div></div></div>';
    }).join('');
    el.scrollTop=el.scrollHeight;
  }catch(e){document.getElementById('chatMessages').innerHTML='<div style="text-align:center;color:#dc2626;font-size:12px;padding:20px">Kunde inte ladda</div>';}
}

async function sendChat(){
  const input=document.getElementById('chatInput');const text=input?input.value.trim():'';
  if(!text||!currentChatKey)return;
  const el=document.getElementById('chatMessages');
  const msg=document.createElement('div');msg.className='cmsg mine';
  msg.innerHTML='<div class="cav">'+(driver.name?.charAt(0)||'F')+'</div>'+
    '<div style="max-width:72%"><div style="font-size:10px;color:#94a3b8;margin-bottom:2px;text-align:right">'+(driver.name?.split(' ')[0]||'Förare')+'</div>'+
    '<div class="cbubble">'+text+'</div></div>';
  el.appendChild(msg);el.scrollTop=el.scrollHeight;if(input)input.value='';
  try{await fetch(API+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({thread_key:currentChatKey,sender_name:driver.name,sender_role:'driver',content:text})});}catch(e){}
}

function confirmLogout(){
  document.getElementById('logoutConfirm').classList.remove('open');
  if(activeBooking){showToast('⚠️ Du kan inte logga ut under ett pågående uppdrag','#dc2626','white');return;}
  logout();
}

function logout(){
  if(onlineTimer)clearInterval(onlineTimer);
  if(pauseTimer)clearInterval(pauseTimer);
  if(blockTimer)clearInterval(blockTimer);
  if(socket)socket.disconnect();
  localStorage.removeItem('thtcab_driver');localStorage.removeItem('thtcab_driver_token');
  localStorage.removeItem('thtcab_active_booking');localStorage.removeItem('thtcab_online_seconds');
  localStorage.removeItem('thtcab_paused_at');localStorage.removeItem('thtcab_block_until');
  driver=null;token=null;activeBooking=null;onlineSeconds=0;
  showScreen('sLogin');
}
</script>
