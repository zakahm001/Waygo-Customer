<script>


var API = 'https://api.trollhattancab.com';
var allBookings = [], allDrivers = [], allCustomers = [], allStaff = [], allCompanies = [], allCars = [];
var curTab = 0, socket = null, driverPos = {}, refreshTimer = null;
var staffUser = null, staffToken = null;
var assignId = null, assignRef = null, cancelId = null, cancelRef = null;
var chatKey = null;
var driverPositions = {};

function closeMod(id){try{document.getElementById(id).classList.remove('open');}catch(e){}}
function closeMIfOut(e,id){if(e.target===document.getElementById(id))closeMod(id);}



// ── AUDIO CONTEXT UNLOCK ──
var _sharedAudioCtx = null;
document.addEventListener('click', function() {
  if (!_sharedAudioCtx) {
    try { _sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) {}
  } else if (_sharedAudioCtx.state === 'suspended') {
    _sharedAudioCtx.resume();
  }
}, { passive: true });

function getAudioCtx() {
  if (!_sharedAudioCtx) {
    try { _sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { return null; }
  }
  if (_sharedAudioCtx.state === 'suspended') _sharedAudioCtx.resume();
  return _sharedAudioCtx;
}

// ── CHAT SOUND ──
var chatUnread = 0;
var chatThreads = {}; // thread_key -> {unread, lastMsg, lastSender, lastTime}
function playNewBookingAlert() {
  try {
    var ctx = getAudioCtx(); if(!ctx)return;
    [523, 659, 784].forEach(function(freq, i) {
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = freq;
      o.type = 'triangle';
      g.gain.setValueAtTime(0.4, ctx.currentTime + i * 0.18);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.18 + 0.3);
      o.start(ctx.currentTime + i * 0.18);
      o.stop(ctx.currentTime + i * 0.18 + 0.3);
    });
  } catch(e) {}
}

function playChatAlert() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1100].forEach(function(freq, i) {
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = freq;
      o.type = 'sine';
      g.gain.setValueAtTime(0.25, ctx.currentTime + i*0.15);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.15 + 0.3);
      o.start(ctx.currentTime + i*0.15);
      o.stop(ctx.currentTime + i*0.15 + 0.3);
    });
  } catch(e) {}
}

function updateChatBadge(count) {
  chatUnread = count;
  var badge = document.getElementById('navBadge4');
  if (!badge) return;
  if (count > 0) {
    badge.textContent = count;
    badge.style.display = 'inline-block';
    badge.style.background = '#dc2626';
    badge.style.color = 'white';
    badge.style.borderRadius = '10px';
    badge.style.padding = '1px 7px';
    badge.style.fontSize = '10px';
    badge.style.fontWeight = '700';
    badge.style.marginLeft = '4px';
    badge.style.animation = 'pulse 1s infinite';
  } else {
    badge.style.display = 'none';
  }
}

function playDeclineAlert(){
  try{
    const ctx=getAudioCtx();if(!ctx)return;
    const beep=(freq,start,dur)=>{
      const osc=ctx.createOscillator();const gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.frequency.value=freq;osc.type='sine';
      gain.gain.setValueAtTime(0.8,ctx.currentTime+start);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+start+dur);
      osc.start(ctx.currentTime+start);osc.stop(ctx.currentTime+start+dur);
    };
    beep(440,.0,.3);beep(330,.35,.3);beep(220,.7,.5);
  }catch(e){}
}



// ── ÅKERI ROLE ──
function isAkeri(){ return false; } // åkeri use portal.trollhattancab.com
function akeriCompanyId(){ return staffUser && (staffUser.company_id || null); }

function filterForAkeri(drivers){ 
  if(!isAkeri()) return drivers;
  return drivers.filter(function(d){ return d.company_id === akeriCompanyId(); });
}
function filterBookingsForAkeri(bookings){
  if(!isAkeri()) return bookings;
  return bookings.filter(function(b){ return b.akeri_id === akeriCompanyId() || b.company_id === akeriCompanyId(); });
}

function showToast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');},3500);
}

function showAlert(msg,type){
  var bar=document.getElementById('alertBar'),txt=document.getElementById('alertTxt');
  if(!bar||!txt)return;
  bar.className='alert-bar show a-'+(type||'info');
  txt.textContent=msg;setTimeout(function(){bar.classList.remove('show');},8000);
}

// ── LOGIN ──
function checkAuth(){
  var sv=localStorage.getItem('thtcab_staff');
  var st=localStorage.getItem('thtcab_staff_token');
  if(sv&&st){
    try{staffUser=JSON.parse(sv);staffToken=st;updateNav();return true;}catch(e){}
  }
  showLogin();return false;
}

function showLogin(){
  document.getElementById('main').innerHTML=

    '<div style="background:white;border-radius:16px;padding:32px 24px;width:100%;max-width:400px;border:1px solid #d0d7ea">'+
    '<div style="text-align:center;margin-bottom:24px">'+
    '<div style="font-size:44px">🚖</div>'+
    '<div style="font-size:20px;font-weight:bold;color:#0d1b3e;margin-top:8px">Trollhättan Cab</div>'+

async function doLogin(){
  var email=document.getElementById('lEmail').value.trim();
  var pwd=document.getElementById('lPwd').value.trim();
  var err=document.getElementById('lErr');
  var btn=document.getElementById('lBtn');
  if(!email||!pwd){err.textContent='⚠️ Fyll i e-post och lösenord';err.style.display='';return;}
  btn.textContent='Loggar in...';btn.disabled=true;err.style.display='none';
  try{
    var res=await fetch(API+'/staff/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pwd})});
    var data=await res.json();
    if(data.token){
      staffUser=data.staff;staffToken=data.token;
      localStorage.setItem('thtcab_staff',JSON.stringify(staffUser));
      localStorage.setItem('thtcab_staff_token',staffToken);
      updateNav();init();
    }else{err.textContent='⚠️ '+(data.error||'Fel uppgifter');err.style.display='';}
  }catch(e){err.textContent='⚠️ Kunde inte ansluta';err.style.display='';}
  btn.textContent='Logga in →';btn.disabled=false;
}

function logout(){
  localStorage.removeItem('thtcab_staff');localStorage.removeItem('thtcab_staff_token');
  staffUser=null;staffToken=null;
  if(refreshTimer)clearInterval(refreshTimer);
  if(socket)socket.disconnect();
  showLogin();
}

function updateNav(){
  if(!staffUser)return;
  var nn=document.getElementById('navName'); if(nn)nn.textContent=staffUser.name;
  var labels={superadmin:'Super Admin',admin:'Admin',dispatcher:'Dispatcher'};
  var classes={superadmin:'r1',admin:'r2',dispatcher:'r3'};
  var roleEl=document.getElementById('navRole');
  if(roleEl){roleEl.textContent=labels[staffUser.role]||staffUser.role;roleEl.className='nav-role '+(classes[staffUser.role]||'r3');}
  var t5=document.getElementById('tab5'); if(t5)t5.style.display=(staffUser.level<=2)?'':'none';
  // Block åkeri from central
  if(staffUser.role==='akeri'){
    alert('Åkeriägare loggar in via portal.trollhattancab.com');
    logout(); return;
  }
}

window.onload=function(){if(checkAuth())init();};

async function init(){
  await loadData();connectSocket();showTab(0);requestNotifPermission();listenForDriverResponses();
  if(refreshTimer)clearInterval(refreshTimer);
  refreshTimer=setInterval(async function(){
    await loadData();
    // Only re-render if user is not typing in a form field
    var active=document.activeElement;
    var isTyping=active&&(active.tagName==='INPUT'||active.tagName==='TEXTAREA'||active.tagName==='SELECT');
    if(!isTyping)showTab(curTab);
  },8000);
}

async function loadData(){
  try{
    var headers={'Authorization':'Bearer '+(staffToken||'')};
    var r1=await fetch(API+'/bookings',{headers:headers});
    var r2=await fetch(API+'/drivers',{headers:headers});
    var d1=await r1.json();var d2=await r2.json();
    allBookings=d1.bookings||[];allDrivers=d2.drivers||[];
    // Seed driverPositions from stored lat/lng
    allDrivers.forEach(function(d){
      if(d.lat&&d.lng) driverPositions[d.id]={lat:parseFloat(d.lat),lng:parseFloat(d.lng)};
    });
    if(staffToken&&staffUser&&staffUser.level<=2){
      try{
        var r3=await fetch(API+'/customers',{headers:{'Authorization':'Bearer '+staffToken}});
        var r4=await fetch(API+'/staff',{headers:{'Authorization':'Bearer '+staffToken}});
        var d3=await r3.json();var d4=await r4.json();
        allCustomers=d3.customers||[];allStaff=d4.staff||[];
        try{
          var r5=await fetch(API+'/companies',{headers:{'Authorization':'Bearer '+staffToken}});
          var d5=await r5.json();allCompanies=d5.companies||[];
        }catch(e){}
      }catch(e){}
    }
    // Load cars
    var carsRes=await fetch(API+'/cars',{headers:{'Authorization':'Bearer '+staffToken}}).catch(function(){return {json:function(){return {cars:[]};}}; });
    var carsData=await carsRes.json();
    if(carsData.cars)allCars=carsData.cars;
  }catch(e){console.log('Load error:',e);}
}

function connectSocket(){
  // Ensure Leaflet redraws when window resizes
  window.addEventListener('resize', function(){
    if(leafletMapInstance) leafletMapInstance.invalidateSize();
  });
  try{
    socket=io(API,{timeout:5000});
    socket.on('connect',function(){socket.emit('central:join');});
    socket.on('booking:new',function(b){
      allBookings.unshift(b);
      playNewBookingAlert();
      showAlert('🚨 Ny bokning! '+b.booking_ref+' · '+b.from_address,'warn');
      showToast('🚨 Ny bokning: '+b.booking_ref);
      sendBrowserNotif('🚨 Ny bokning — '+b.booking_ref, b.from_address+' → '+b.to_address, 'new-booking', function(){ showTab(0); });
      if(curTab===0)showTab(0);
    });
    socket.on('booking:assigned',function(b){
      allBookings=allBookings.map(function(x){return x.id===b.id?Object.assign({},x,b):x;});
      if(curTab===0)showTab(0);
    });
    socket.on('booking:completed',function(b){
      allBookings=allBookings.map(function(x){return x.id===b.id?Object.assign({},x,b,{status:'completed'}):x;});
      allDrivers=allDrivers.map(function(d){return d.id===b.driver_id?Object.assign({},d,{status:'available'}):d;});
      showAlert('✅ Avslutad — '+b.booking_ref+' · '+(b.fare_sek||0)+' kr','success');
      if(curTab===0)showTab(0);
    });
    socket.on('booking:declined',function(data){
      var driver=allDrivers.find(function(d){return d.id===data.driverId;});
      var driverName=driver?driver.name:'Förare';
      playDeclineAlert();
      sendBrowserNotif('⚠️ Förare nekade bokning', driverName+' — tilldela om!', 'declined');
      showAlert('⚠️ '+driverName+' nekade bokning #'+data.bookingId+' — tilldela ny förare','warn');
      showToast('⚠️ '+driverName+' nekade — tilldela ny förare');
      loadData().then(function(){if(curTab===0)showTab(0);});
    });
    socket.on('booking:returned',function(b){
      allBookings=allBookings.map(function(x){return x.id===b.id?Object.assign({},x,{status:'pending',driver_id:null,driver_name:null}):x;});
      playDeclineAlert();
      sendBrowserNotif('⚠️ Förare returnerade bokning', (b.booking_ref||'')+(b.driver_name?' — '+b.driver_name:''), 'returned');
      showCentralNotif('⚠️ Förare returnerade bokning', (b.booking_ref||'')+(b.driver_name?' ('+b.driver_name+')':''), '#d97706', 0);
      showToast('⚠️ Bokning returnerad — tilldela om!');
      if(curTab===0)showTab(0);
    });

    // Auto-dispatch status updates
    socket.on('message:new', function(data) {
      if (!data || data.sender_role === 'staff') return;
      playChatAlert();
      chatUnread++;
      updateChatBadge(chatUnread);
      // Track per-thread state
      if (data.thread_key) {
        if (!chatThreads[data.thread_key]) chatThreads[data.thread_key] = {unread:0};
        chatThreads[data.thread_key].unread = (chatThreads[data.thread_key].unread||0) + 1;
        chatThreads[data.thread_key].lastMsg = data.content||'';
        chatThreads[data.thread_key].lastSender = data.sender_name||'';
        chatThreads[data.thread_key].lastTime = new Date().toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});
      }
      var senderLabel = data.sender_role === 'customer' ? '👤 Kund' : '🚖 ' + (data.sender_name||'Förare');
      sendBrowserNotif(senderLabel, data.content||'', 'chat-'+data.thread_key, function(){ showTab(4); });
      showMessagePopup(senderLabel, data.content||'');
    });
  socket.on('dispatch:status',function(data){
      // Update or create dispatch status banner for this booking
      var key='dispatch-'+data.booking_id;
      var existing=document.getElementById(key);
      var color=data.status==='accepted'?'#dcfce7':data.status==='failed'?'#fee2e2':data.status==='no_response'?'#fef3c7':'#dbeafe';
      var textColor=data.status==='accepted'?'#15803d':data.status==='failed'?'#dc2626':data.status==='no_response'?'#d97706':'#1a56db';
      var html='<div id="'+key+'" style="background:'+color+';border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:13px;color:'+textColor+';font-weight:600;display:flex;justify-content:space-between;align-items:center">'+
        '<span>'+data.booking_ref+' — '+data.message+'</span>'+
        (data.queue_total?'<span style="font-size:11px;opacity:.7">'+data.queue_position+'/'+data.queue_total+'</span>':'')+
        '</div>';
      var container=document.getElementById('dispatchLog');
      if(container){
        if(existing){existing.outerHTML=html;}
        else{container.insertAdjacentHTML('afterbegin',html);}
      }
      // Play sound on failure
      if(data.status==='failed'){
      playDeclineAlert();
      if(data.is_two_car){
        showToast('⚠️ 2-bil bokning behöver manuell tilldelning! '+data.booking_ref,'#dc2626');
        // Flash booking tab
        var t0=document.getElementById('tab0');
        if(t0){t0.style.background='#fee2e2';setTimeout(function(){t0.style.background='';},3000);}
      }
    }
      if(curTab===0)showTab(0);
    });
    socket.on('dispatch:failed',function(data){
      showAlert('🚨 '+data.booking_ref+' — '+data.reason+' — Tilldela manuellt!','warn');
      playDeclineAlert();
      loadData().then(function(){if(curTab===0)showTab(0);});
    });

    socket.on('booking:cancelled',function(data){
      allBookings=allBookings.map(function(b){return b.id===data.id?Object.assign({},b,{status:'cancelled',driver_id:null,driver_name:null}):b;});
      var bk=allBookings.find(function(b){return b.id===data.id;});
      var ref=bk?bk.booking_ref:(data.booking_ref||'#'+data.id);
      playDeclineAlert();
      sendBrowserNotif('❌ Kund avbokade', ref, 'cancelled');
      showCentralNotif('❌ Kund avbokade', ref + ' — '+(bk?bk.from_address||'':''), '#dc2626', 0);
      showToast('❌ Kund avbokade: ' + ref);
      if(curTab===0)showTab(0);
    });
    socket.on('driver:location',function(data){
      var did=data.driver_id||data.driverId;
      driverPositions[did]={lat:data.lat,lng:data.lng};
      updateMarker(did,data.lat,data.lng);
    });
    socket.on('driver:status',function(data){
      var prevStatus = (allDrivers.find(function(d){return d.id===data.driverId;})||{}).status;
      allDrivers=allDrivers.map(function(d){return d.id===data.driverId?Object.assign({},d,{status:data.status}):d;});
      if(curTab===2)showTab(2);
      // Alert if driver goes offline while busy
      if((data.status==='offline'||data.status==='deleted') && prevStatus==='busy'){
        var d=allDrivers.find(function(x){return x.id===data.driverId;});
        if(d) showCentralNotif('⚠️ Förare gick offline!', (d.name||'Förare')+' hade aktiv bokning', '#dc2626', 6000);
      }
    });
  }catch(e){console.log('Socket error:',e);}
}

function showTab(i,extra){
  try{
    curTab=i;
    document.querySelectorAll('.tab').forEach(function(t){var n=parseInt((t.id||'').replace('tab',''));t.classList.toggle('on',n===i);});
    var m=document.getElementById('main');if(!m)return;
    if(i===0)m.innerHTML=tabBookings(extra);
    else if(i===1){m.innerHTML=tabMap();setTimeout(initMapTab,50);}
    else if(i===2)m.innerHTML=tabDrivers(extra);
    else if(i===3)m.innerHTML=tabCustomers();
    else if(i===4)m.innerHTML=tabChat();
    else if(i===5)m.innerHTML=tabStaff();
    else if(i===6)m.innerHTML=tabCompanies();
    else if(i===7){m.innerHTML=tabVehicles();}
  }catch(e){console.error(e);}
}
function locateDriver(driverId) {
  var pos = driverPositions[driverId];
  if (!pos || !pos.lat || !pos.lng) {
    showToast('⚠️ Ingen GPS — föraren har ingen aktiv position');
    return;
  }
  // Switch to map tab
  if (curTab !== 1) {
    showTab(1);
    setTimeout(function(){ locateDriver(driverId); }, 600);
    return;
  }
  if (!leafletMapInstance) {
    setTimeout(function(){ locateDriver(driverId); }, 400);
    return;
  }
  // Smooth fly to driver
  leafletMapInstance.flyTo([pos.lat, pos.lng], 16, { animate:true, duration:1.2 });
  // Show marker popup with name + status
  var marker = leafletMarkers[driverId];
  if (marker) {
    setTimeout(function(){ marker.openPopup(); }, 1000);
  }
  // Small toast — don't open full profile modal (user can click marker for that)
  var d = allDrivers.find(function(x){ return x.id===driverId; });
  if (d) showToast('📍 '+d.name+' · '+(d.plate||''), '#0d1b3e');
}

function sc(val,lbl,color,onclick){return '<div class="scard"'+(onclick?' onclick="'+onclick+'" style="cursor:pointer"':'')+' ><div class="sval" style="color:'+color+'">'+val+'</div><div class="slbl">'+lbl+'</div></div>';}

function getBadge(s){
  if(s==='pending')return '<span class="badge bp">Väntar</span>';
  if(s==='assigned')return '<span class="badge ba">Tilldelad</span>';
  if(s==='completed')return '<span class="badge bc">Avslutad</span>';
  if(s==='cancelled')return '<span class="badge bx">Avbokad</span>';
  return '<span class="badge bx">'+s+'</span>';
}

function bcard(b){
  var isPre=b.booking_type==='pre';
  var cls='bcard '+(b.status==='pending'?'pending':b.status==='assigned'?'assigned':b.status==='completed'?'completed':'cancelled');
  var actions='';
  if(b.status==='pending'){
    actions='<button class="btn btnP btn-sm" onclick="openAssign('+b.id+',\''+b.booking_ref+'\')">Tilldela förare</button>'+
      '<button class="btn btnD btn-sm" onclick="openCancel('+b.id+',\''+b.booking_ref+'\')">Avboka</button>';
  }else if(b.status==='assigned'){
    actions='<button class="btn btnB btn-sm" onclick="openChat(\'central-driver-'+b.driver_id+'\',\'Förare: '+(b.driver_name||'')+'\')">💬 Förare</button>'+
      '<button class="btn btnT btn-sm" onclick="openChat(\'customer-central-'+b.id+'\',\'Kund: '+b.customer_name+'\')">💬 Kund</button>'+
      (b.customer_phone?'<a href="tel:'+b.customer_phone+'" style="text-decoration:none"><button class="btn btn-sm" style="background:#dcfce7;color:#15803d">📞 Ring</button></a>':'')+
      (staffUser&&staffUser.level<=2?'<button class="btn btnY btn-sm" onclick="openReassignById('+b.id+')">🔄 Tilldela om</button>':'')+
      '<button class="btn btnD btn-sm" onclick="openCancel('+b.id+',\''+b.booking_ref+'\')">Avboka</button>';
  }else if(b.status==='completed'){
    actions='<button class="btn btnG btn-sm" onclick="showToast(\'📄 '+b.booking_ref+' · '+(b.fare_sek||0)+' kr\')">📄 Kvitto</button>';
  }
  return '<div class="'+cls+'">'+
    '<div class="btop"><span class="bref">'+b.booking_ref+'</span>'+
    '<div style="display:flex;gap:4px">'+(isPre?'<span class="badge bpre">📅 Förbokning</span>':'')+getBadge(b.status)+'</div></div>'+
    (isPre&&b.scheduled_at?'<div style="font-size:11px;color:#7c3aed;font-weight:700;margin-bottom:4px">📅 '+new Date(b.scheduled_at).toLocaleString('sv-SE',{dateStyle:'medium',timeStyle:'short'})+'</div>':'')+
    '<div class="broute">📍 '+b.from_address+' → 🏁 '+b.to_address+'</div>'+
    (b.passengers>=5?'<div style="background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;color:#d97706;margin-bottom:8px">⚠️ '+b.passengers+' passagerare — mogelijk 2 bilar</div>':'')+
    (b.driver_note?'<div style="background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:6px 12px;font-size:12px;color:#d97706;margin-bottom:8px">📝 '+b.driver_note+'</div>':'')+
    '<div class="bdetail">👤 '+b.customer_name+' · '+(b.customer_phone||'')+'<br>'+
    (b.passengers&&b.passengers>1?'👥 '+b.passengers+' passagerare · ':'')+
    (b.child_seat?'🧒 Barnstol'+(b.child_age?' ('+b.child_age+')':'')+' · ':'')+
    (b.driver_name?'🚖 '+b.driver_name+' · ':'')+b.fare_sek+' kr · '+b.payment_method+'<br>🕐 '+new Date(b.created_at).toLocaleString('sv-SE',{dateStyle:'short',timeStyle:'short'})+'</div>'+
    (actions?'<div class="bactions">'+actions+'</div>':'')+
    '</div>';
}

function initMapTab(){
  var avail=allDrivers.filter(function(d){return d.status!=='offline';});
  // Check map div exists
  if(!document.getElementById('leafletMap')){
    setTimeout(initMapTab,100); return;
  }
  // Check Leaflet loaded first
  if(!window.L){
    // Load Leaflet CSS
    if(!document.querySelector('link[href*="leaflet"]')){
      var link=document.createElement('link');
      link.rel='stylesheet';link.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
      document.head.appendChild(link);
    }
    // Load Leaflet JS
    if(!document.querySelector('script[src*="leaflet"]')){
      var script=document.createElement('script');
      script.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      script.onload=function(){ initLeafletMap(avail); };
      document.head.appendChild(script);
    } else {
      // Script tag exists but L not ready yet - retry
      setTimeout(function(){ if(window.L) initLeafletMap(avail); else initMapTab(); },300);
    }
  } else {
    initLeafletMap(avail);
    // CRITICAL: tell Leaflet the container dimensions after it's in the DOM
    setTimeout(function(){
      if(leafletMapInstance) leafletMapInstance.invalidateSize();
    }, 50);
  }
}

function addZoneOverlays(map) {
  function addZone(zone, isTHN) {
    var latlngs = zone.poly.map(function(p){ return [p[0],p[1]]; });
    // Border line only — no fill for municipalities, slight fill for Trollhättan
    L.polygon(latlngs, {
      color: zone.color,
      weight: isTHN ? 3 : 2,
      fillColor: zone.color,
      fillOpacity: isTHN ? 0.06 : 0.03,
      dashArray: isTHN ? null : '8,6',
      interactive: false
    }).addTo(map);
    // Label at centroid
    var lats=zone.poly.map(function(p){return p[0];}), lngs=zone.poly.map(function(p){return p[1];});
    var cLat=lats.reduce(function(a,b){return a+b;})/lats.length;
    var cLng=lngs.reduce(function(a,b){return a+b;})/lngs.length;
    L.marker([cLat,cLng],{icon:L.divIcon({
      html:'<div style="background:'+zone.color+';color:white;font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.3)">'+(isTHN?'THN ':zone.id+' ')+zone.name+'</div>',
      className:'',iconAnchor:[50,10]
    }),interactive:false}).addTo(map);
  }
  addZone(ZONE_TROLLHATTAN_MAP, true);
  ZONES_VG_MAP.forEach(function(z){ addZone(z, false); });
}


function addLeafletMarker(map, driver, lat, lng){
  var color=driver.status==='available'?'#22c55e':driver.status==='busy'?'#f97316':'#64748b';
  var icon=makeTaxiIcon(driver.status, driver.name);
  var statusTxt=driver.status==='available'?'🟢 Ledig':driver.status==='busy'?'🟠 På uppdrag':'⚫ Offline';
  var marker=L.marker([lat,lng],{icon:icon}).addTo(map);
  marker.bindPopup(
    '<div style="font-size:13px;min-width:140px">'+
    '<strong>'+driver.name+'</strong><br>'+
    '<span style="color:#64748b">'+driver.plate+(driver.taxi_nr?' · '+driver.taxi_nr:'')+'</span><br>'+
    statusTxt+
    '</div>'
  );
  // Label
  L.marker([lat,lng],{
    icon:L.divIcon({
      html:'<div style="font-size:11px;font-weight:700;color:#0d1b3e;white-space:nowrap;margin-top:2px;text-shadow:0 1px 2px white">'+driver.name.split(' ')[0]+'</div>',
      className:'',iconSize:[60,16],iconAnchor:[30,-18]
    }),interactive:false
  }).addTo(map);
  // Click to center and open profile
  marker.on('click', function(){
    if(leafletMapInstance) leafletMapInstance.setView([lat,lng],15);
    openDriverProfile(driver.id);
  });
  marker.bindTooltip(driver.name+' · '+(driver.plate||''), {permanent:false, direction:'top'});
  leafletMarkers[driver.id]=marker;
  return marker;
}

function updateMarker(id,lat,lng){
  // Update driverPositions
  driverPositions[id]={lat:lat,lng:lng};
  if(leafletMapInstance&&leafletMarkers[id]){
    leafletMarkers[id].setLatLng([lat,lng]);
  } else if(leafletMapInstance){
    // New driver came online with GPS — add marker
    var d=allDrivers.find(function(x){return x.id===id;});
    if(d)addLeafletMarker(leafletMapInstance,d,lat,lng);
  }
}

async function createSecondCar(bookingId) {
  var b = allBookings.find(function(x){ return x.id===bookingId; });
  if (!b) return;
  if (!confirm('Skapa en andra bokning för ' + b.booking_ref + '?')) return;
  var groupId = b.booking_ref + '-GRP';
  try {
    // Update first booking with group info
    await fetch(API+'/bookings/'+bookingId, { method:'PATCH', headers:{'Content-Type':'application/json','Authorization':'Bearer '+staffToken},
      body: JSON.stringify({ booking_group: groupId, car_number: 1, car_total: 2 }) });
    // Create second booking
    var res = await fetch(API+'/bookings', { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+staffToken},
      body: JSON.stringify({
        customer_name: b.customer_name, customer_phone: b.customer_phone,
        from_address: b.from_address, to_address: b.to_address,
        payment_method: b.payment_method, fare_sek: b.fare_sek,
        passengers: b.passengers, notes: 'Bil 2 av 2 ('+b.booking_ref+')',
        booking_group: groupId, car_number: 2, car_total: 2
      })
    });
    var data = await res.json();
    if (data.booking) { showToast('✅ Bokning 2 skapad: '+data.booking.booking_ref); await loadData(); showTab(0); }
    else showToast('⚠️ '+(data.error||'Fel'));
  } catch(e) { showToast('⚠️ Nätverksfel'); }
}

function tabBookings(filter) {
  var today = new Date().toDateString();
  var pending   = allBookings.filter(function(b){ return b.status==='pending'; });
  var active    = allBookings.filter(function(b){ return b.status==='assigned'; });
  var completed = allBookings.filter(function(b){ return b.status==='completed' && new Date(b.created_at).toDateString()===today; });
  var cancelled = allBookings.filter(function(b){ return b.status==='cancelled' && new Date(b.created_at).toDateString()===today; });
  var earnings  = completed.reduce(function(s,b){ return s+(b.fare_sek||0); }, 0);
  var avgFare   = completed.length ? Math.round(earnings/completed.length) : 0;
  var available = allDrivers.filter(function(d){ return d.status==='available'&&!d.blocked; });

  var h = '<div class="page">';

  // ── STAT CARDS ──
  h += '<div class="stats">';
  h += sc(active.length,    'Aktiva',         '#1a56db', "showTab(0,'assigned')");
  h += sc(pending.length,   'Väntar',         '#d97706', "showTab(0,'pending')");
  h += sc(available.length, 'Lediga förare',  '#15803d', "showTab(2,'available')");
  h += sc(earnings+' kr',   'Intäkter idag',  '#7c3aed');
  h += '</div>';

  // ── REVENUE DETAIL ──
  h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">';
  h += '<div style="background:#f0fdf4;border-radius:10px;padding:10px;text-align:center"><div style="font-size:16px;font-weight:800;color:#15803d">'+completed.length+'</div><div style="font-size:10px;color:#64748b">AVSLUTADE</div></div>';
  h += '<div style="background:#fef2f2;border-radius:10px;padding:10px;text-align:center"><div style="font-size:16px;font-weight:800;color:#dc2626">'+cancelled.length+'</div><div style="font-size:10px;color:#64748b">AVBOKADE</div></div>';
  h += '<div style="background:#ede9fe;border-radius:10px;padding:10px;text-align:center"><div style="font-size:16px;font-weight:800;color:#7c3aed">'+avgFare+' kr</div><div style="font-size:10px;color:#64748b">SNITT/RESA</div></div>';
  h += '</div>';

  // ── PER DRIVER REVENUE ──
  var driverRevHtml = '';
  allDrivers.forEach(function(d){
    var dBooks = completed.filter(function(b){ return b.driver_id===d.id; });
    var dRev = dBooks.reduce(function(s,b){ return s+(b.fare_sek||0); }, 0);
    if(dRev > 0 || dBooks.length > 0){
      var pct = earnings > 0 ? Math.round(dRev/earnings*100) : 0;
      driverRevHtml += '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9">';
      driverRevHtml += '<div style="width:30px;height:30px;border-radius:50%;background:#0d1b3e;color:#fbbf24;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+d.name.charAt(0)+'</div>';
      driverRevHtml += '<div style="flex:1"><div style="font-weight:700;font-size:13px">'+d.name+'</div>';
      driverRevHtml += '<div style="background:#f1f5f9;border-radius:20px;height:6px;margin-top:3px"><div style="background:#7c3aed;height:100%;width:'+pct+'%;border-radius:20px"></div></div></div>';
      driverRevHtml += '<div style="text-align:right"><div style="font-weight:800;color:#7c3aed;font-size:13px">'+dRev+' kr</div><div style="font-size:10px;color:#94a3b8">'+dBooks.length+' resor</div></div></div>';
    }
  });
  if(driverRevHtml) h += '<div class="card"><div class="stitle">Intäkt per förare idag</div>'+driverRevHtml+'</div>';

  // ── PENDING BOOKINGS ──
  if(pending.length){
    h += '<div class="stitle" id="section-pending">🔴 Väntar på förare ('+pending.length+')</div>';
    pending.forEach(function(b){ h += bcard(b); });
  }

  // ── ACTIVE BOOKINGS ──
  if(active.length){
    h += '<div class="stitle" id="section-assigned">🟠 Aktiva ('+active.length+')</div>';
    active.forEach(function(b){ h += bcard(b); });
  }

  // ── COMPLETED TODAY ──
  if(completed.length){
    h += '<div class="stitle" id="section-completed">✅ Avslutade idag ('+completed.length+')</div>';
    completed.slice(0,10).forEach(function(b){ h += bcard(b); });
  }

  if(!pending.length && !active.length){
    h += '<div class="empty">📋<br>Inga aktiva bokningar</div>';
  }

  h += '<div style="height:80px"></div></div>';

  // Scroll to section if filter specified
  if(filter && filter !== 'all'){
    setTimeout(function(){
      var el = document.getElementById('section-'+filter);
      if(el) el.scrollIntoView({behavior:'smooth'});
    }, 100);
  }

  return h;
}

async function deleteDriver(id,name){
  if(!confirm('Ta bort '+name+'? Kan inte ångras!'))return;
  try{
    var res=await fetch(API+'/drivers/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+staffToken}});
    var data=await res.json();
    if(data.ok){allDrivers=allDrivers.filter(function(d){return d.id!==id;});showToast('Borttagen: '+name);closeMod('driverMod');showTab(2);}
    else{showToast(data.error||'Fel');}
  }catch(e){showToast('Nätverksfel');}
}

}

// CUSTOMER PROFILE
// ═══════════════════════════════════════════════════════

function openCustomerProfile(id){
  var c=allCustomers.find(function(x){return x.id===id;});
  if(!c)return;
  var trips=allBookings.filter(function(b){return b.customer_id===c.id;});
  var parts=[];
  parts.push('<div style="font-weight:800;font-size:17px;margin-bottom:4px">'+c.name+'</div>');
  parts.push('<div style="font-size:13px;color:#64748b">📱 '+c.phone+'</div>');
  parts.push('<div style="font-size:13px;color:#64748b">✉️ '+(c.email||'Ingen e-post')+'</div>');
  parts.push('<div style="font-size:13px;margin-top:8px;margin-bottom:12px">'+trips.length+' resor · '+(c.blocked?'<span style="color:#dc2626">🔴 Blockerad</span>':'<span style="color:#22c55e">✅ Aktiv</span>')+'</div>');
  parts.push('<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">');
  parts.push(c.blocked?'<button onclick="manageCustomer('+id+',\'unblock\')" style="padding:10px;background:#dcfce7;color:#15803d;border:none;border-radius:8px;font-weight:700;cursor:pointer">✅ Avblockera</button>':'<button onclick="manageCustomer('+id+',\'block\')" style="padding:10px;background:#fee2e2;color:#dc2626;border:none;border-radius:8px;font-weight:700;cursor:pointer">🔴 Blockera</button>');
  parts.push('<button onclick="openChat(\'customer-central-'+id+'\',\''+c.name+'\')" style="padding:10px;background:#0d9488;color:white;border:none;border-radius:8px;font-weight:700;cursor:pointer">💬 Chatta</button></div>');
  trips.slice(0,5).forEach(function(b){
    parts.push('<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:12px"><div><div style="font-weight:700;color:#1a56db">'+b.booking_ref+'</div><div style="color:#94a3b8">'+new Date(b.created_at).toLocaleString('sv-SE',{dateStyle:'short',timeStyle:'short'})+'</div></div><div style="font-weight:800;color:#15803d">'+(b.fare_sek||0)+' kr</div></div>');
  });
  document.getElementById('customerModTitle').textContent=c.name;
  document.getElementById('customerModContent').innerHTML=parts.join('');
  document.getElementById('customerMod').classList.add('open');
}

async function manageCustomer(id,action){
  try{
    var res=await fetch(API+'/customers/'+id+'/manage',{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':'Bearer '+staffToken},body:JSON.stringify({action:action})});
    var data=await res.json();
    if(data.customer){allCustomers=allCustomers.map(function(c){return c.id===id?Object.assign({},c,data.customer):c;});showToast('✅ Kund uppdaterad');closeMod('customerMod');}
    else{showToast('⚠️ '+(data.error||'Fel'));}
  }catch(e){showToast('⚠️ Nätverksfel');}
}

// ═══════════════════════════════════════════════════════
// CHAT
// ═══════════════════════════════════════════════════════

var chatThreads={};
var chatKey='';

function openChat(key,name){
  if(chatThreads[key]){chatUnread=Math.max(0,chatUnread-(chatThreads[key].unread||0));chatThreads[key].unread=0;updateChatBadge(chatUnread);}
  chatKey=key;
  document.getElementById('chatTitle').textContent='💬 '+name;
  document.getElementById('chatMsgs').innerHTML='<div style="text-align:center;color:#94a3b8;font-size:12px;padding:20px">Laddar...</div>';
  document.getElementById('chatMod').classList.add('open');
  loadChat(key);
}

async function loadChat(key){
  try{
    var res=await fetch(API+'/messages/'+encodeURIComponent(key),{headers:{'Authorization':'Bearer '+staffToken}});
    var data=await res.json();
    var msgs=data.messages||[];
    var el=document.getElementById('chatMsgs');
    if(!el)return;
    el.innerHTML=msgs.map(function(m){
      var isMe=m.sender_role==='staff';
      return '<div style="display:flex;justify-content:'+(isMe?'flex-end':'flex-start')+';margin-bottom:8px">'+
        '<div style="background:'+(isMe?'#0d1b3e':'white')+';color:'+(isMe?'white':'#0d1b3e')+';padding:8px 12px;border-radius:12px;max-width:78%;font-size:13px">'+
        '<div>'+m.content+'</div>'+
        '<div style="font-size:10px;opacity:.6;margin-top:2px;text-align:right">'+new Date(m.created_at).toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'})+'</div>'+
        '</div></div>';
    }).join('');
    el.scrollTop=el.scrollHeight;
  }catch(e){}
}

async function sendChat(){
  var inp=document.getElementById('chatInput');
  var msg=(inp.value||'').trim();
  if(!msg||!chatKey)return;
  inp.value='';
  try{
    await fetch(API+'/messages',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+staffToken},body:JSON.stringify({thread_key:chatKey,sender_name:staffUser?staffUser.name:'Central',sender_role:'staff',content:msg})});
    loadChat(chatKey);
  }catch(e){}
}

// ═══════════════════════════════════════════════════════
// REASSIGN & CANCEL
// ═══════════════════════════════════════════════════════

function openReassignById(bookingId){
  var b=allBookings.find(function(x){return x.id===bookingId;});
  if(!b)return;
  var available=allDrivers.filter(function(d){return d.status==='available'&&!d.blocked&&d.id!==b.driver_id;});

  var parts=[];
  parts.push('<div style="font-size:13px;color:#64748b;margin-bottom:12px">'+b.from_address+'<br>→ '+(b.to_address||'')+'</div>');
  if(!available.length){
    parts.push('<div class="ib ib-r">⚠️ Inga lediga förare tillgängliga</div>');
  } else {
    parts.push('<div style="font-size:12px;color:#64748b;margin-bottom:10px">Välj ny förare ('+available.length+' lediga):</div>');
    available.forEach(function(d){
      parts.push('<div onclick="doReassign('+bookingId+','+d.id+')" style="display:flex;align-items:center;gap:12px;padding:12px;background:#f8fafc;border-radius:10px;margin-bottom:8px;cursor:pointer;border:1px solid #e2e8f0">'+
        '<div style="width:40px;height:40px;border-radius:50%;background:#0d1b3e;color:#fbbf24;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center">'+d.name.charAt(0)+'</div>'+
        '<div style="flex:1"><div style="font-weight:700">'+d.name+'</div><div style="font-size:12px;color:#64748b">'+(d.plate||'')+'</div></div>'+
        '<div style="color:#22c55e;font-weight:700;font-size:13px">Välj →</div></div>');
    });
  }

  // 5+ passengers: offer to create second booking
  if(b.passengers>=5){
    parts.push('<div style="background:#fef3c7;border-radius:10px;padding:12px;margin-top:10px">'+
      '<div style="font-weight:700;margin-bottom:6px">👥 5+ passagerare</div>'+
      '<div style="font-size:12px;color:#64748b;margin-bottom:10px">Denna bokning har '+b.passengers+' passagerare. Skapa en andra bil?</div>'+
      '<button onclick="createSecondCar('+b.id+')" style="width:100%;padding:10px;background:#f97316;color:white;border:none;border-radius:8px;font-weight:700;cursor:pointer">🚖 Skapa 2:a bil</button>'+
      '</div>');
  }

  document.getElementById('reassignTitle').textContent='Tilldela om — '+b.booking_ref;
  document.getElementById('reassignContent').innerHTML=parts.join('');
  document.getElementById('reassignMod').classList.add('open');
}

async function createSecondCar(originalBookingId){
  var b=allBookings.find(function(x){return x.id===originalBookingId;});
  if(!b)return;
  closeMod('reassignMod');
  try{
    var res=await fetch(API+'/bookings',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+staffToken},
      body:JSON.stringify({customer_name:b.customer_name,customer_phone:b.customer_phone,customer_id:b.customer_id,
        from_address:b.from_address,to_address:b.to_address,payment_method:b.payment_method,
        fare_sek:b.fare_sek,passengers:b.passengers,car_number:2,car_total:2,booking_group:b.booking_group||b.booking_ref,
        notes:'Bil 2 av 2 — skapad från bokning '+b.booking_ref})});
    var data=await res.json();
    if(data.booking){allBookings.unshift(data.booking);showToast('✅ 2:a bil skapad: '+data.booking.booking_ref);showTab(0);}
    else{showToast('⚠️ '+(data.error||'Fel'));}
  }catch(e){showToast('⚠️ Nätverksfel');}
}
function openCancel(bookingId,ref){
  if(!confirm('Avboka '+ref+'?'))return;
  cancelBooking(bookingId);
}

async function cancelBooking(bookingId){
  try{
    var res=await fetch(API+'/bookings/'+bookingId+'/cancel',{method:'POST',headers:{'Authorization':'Bearer '+staffToken}});
    var data=await res.json();
    if(data.ok||data.booking){allBookings=allBookings.map(function(b){return b.id===bookingId?Object.assign({},b,{status:'cancelled'}):b;});showToast('✅ Bokning avbokad');if(curTab===0)showTab(0);}
    else{showToast('⚠️ '+(data.error||'Fel'));}
  }catch(e){showToast('⚠️ Nätverksfel');}
}

// ═══════════════════════════════════════════════════════
// STAFF EDIT
// ═══════════════════════════════════════════════════════

function openStaffEdit(id){
  var s=allStaff.find(function(x){return x.id===id;});
  if(!s)return;
  document.getElementById('editStaffId').value=s.id;
  document.getElementById('editStaffName').value=s.name;
  document.getElementById('editStaffEmail').value=s.email;
  document.getElementById('editStaffRole').value=s.role||'dispatcher';
  document.getElementById('editStaffPwd').value='';
  document.getElementById('staffModTitle').textContent='Redigera: '+s.name;
  document.getElementById('staffMod').classList.add('open');
}

async function saveStaffEdit(){
  var id=parseInt(document.getElementById('editStaffId').value);
  var name=document.getElementById('editStaffName').value.trim();
  var email=document.getElementById('editStaffEmail').value.trim();
  var role=document.getElementById('editStaffRole').value;
  var pwd=document.getElementById('editStaffPwd').value;
  try{
    var res=await fetch(API+'/staff/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':'Bearer '+staffToken},body:JSON.stringify({name:name,email:email,role:role,password:pwd||undefined})});
    var data=await res.json();
    if(data.staff){allStaff=allStaff.map(function(s){return s.id===id?Object.assign({},s,data.staff):s;});showToast('✅ Sparad');closeMod('staffMod');}
    else{document.getElementById('staffModErr').textContent='⚠️ '+(data.error||'Fel');document.getElementById('staffModErr').style.display='';}
  }catch(e){document.getElementById('staffModErr').textContent='⚠️ Nätverksfel';document.getElementById('staffModErr').style.display='';}
}

// ═══════════════════════════════════════════════════════
// QUESTION / POPUP MESSAGE
// ═══════════════════════════════════════════════════════

var questionDriverId=null;
var questionType='question';

function openQuestionModal(driverId,driverName){
  questionDriverId=driverId;
  questionType='question';
  document.getElementById('questionDriverName').textContent=driverName;
  document.getElementById('questionText').value='';
  document.getElementById('questionErr').style.display='none';
  setQType('question');
  document.getElementById('questionMod').classList.add('open');
}

function setQType(type){
  questionType=type;
  var qBtn=document.getElementById('qtypeQ');
  var iBtn=document.getElementById('qtypeI');
  if(type==='question'){
    qBtn.style.borderColor='#7c3aed';qBtn.style.background='#ede9fe';qBtn.style.color='#7c3aed';
    iBtn.style.borderColor='#e2e8f0';iBtn.style.background='white';iBtn.style.color='#64748b';
  }else{
    iBtn.style.borderColor='#1a56db';iBtn.style.background='#dbeafe';iBtn.style.color='#1a56db';
    qBtn.style.borderColor='#e2e8f0';qBtn.style.background='white';qBtn.style.color='#64748b';
  }
}

function sendQuestion(){
  var text=(document.getElementById('questionText').value||'').trim();
  var err=document.getElementById('questionErr');
  if(!text){err.textContent='Skriv ett meddelande';err.style.display='';return;}
  err.style.display='none';
  if(socket&&socket.connected){
    socket.emit('central:question',{driver_id:questionDriverId,message:text,type:questionType,from:staffUser?staffUser.name:'Central'});
    showToast('✅ Meddelande skickat');
    closeMod('questionMod');
  }else{err.textContent='Inte ansluten — ladda om';err.style.display='';}
}

function listenForDriverResponses(){
  if(!socket)return;
  socket.on('driver:question_response',function(data){
    var icon=data.response==='yes'?'✅':data.response==='no'?'❌':'👍';
    showToast(icon+' '+(data.driver_name||'Förare')+': '+(data.response==='yes'?'JA':data.response==='no'?'NEJ':'OK'));
    showMessagePopup((data.driver_name||'Förare')+' svarade',icon+' '+(data.response==='yes'?'JA':data.response==='no'?'NEJ':'OK'));
  });
}

// ═══════════════════════════════════════════════════════
// NOTIFICATIONS
// ═══════════════════════════════════════════════════════

var notifPermission='default';

function requestNotifPermission(){
  if(!('Notification' in window))return;
  if(Notification.permission==='granted'){notifPermission='granted';return;}
  if(Notification.permission!=='denied'){
    var prompt=document.createElement('div');
    prompt.id='notifPrompt';
    prompt.setAttribute('style','position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:9999;background:#0d1b3e;color:white;border-radius:16px;padding:16px 20px;min-width:280px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.4);text-align:center');
    prompt.innerHTML='<div style="font-size:24px;margin-bottom:8px">🔔</div><div style="font-weight:700;margin-bottom:4px">Tillåt notiser</div><div style="font-size:13px;color:#94a3b8;margin-bottom:14px">Få larm även när fliken är i bakgrunden</div><div style="display:flex;gap:8px;justify-content:center"><button id="notifYes" style="flex:1;padding:10px;background:#22c55e;color:white;border:none;border-radius:10px;font-weight:700;cursor:pointer">✅ Tillåt</button><button id="notifNo" style="flex:1;padding:10px;background:#374151;color:white;border:none;border-radius:10px;font-weight:700;cursor:pointer">Senare</button></div>';
    document.body.appendChild(prompt);
    document.getElementById('notifYes').onclick=function(){prompt.remove();Notification.requestPermission().then(function(p){notifPermission=p;});};
    document.getElementById('notifNo').onclick=function(){prompt.remove();};
    setTimeout(function(){if(document.getElementById('notifPrompt'))document.getElementById('notifPrompt').remove();},12000);
  }else{notifPermission=Notification.permission;}
}

function sendBrowserNotif(title,body,tag,onClick){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  try{var n=new Notification(title,{body:body,icon:'/favicon.ico',tag:tag||'thtcab',requireInteraction:true});n.onclick=function(){window.focus();n.close();if(onClick)onClick();};}catch(e){}
}

function showCentralNotif(title,body,color,autoDismiss){
  var old=document.getElementById('centralNotifBanner');if(old)old.remove();
  var banner=document.createElement('div');
  banner.id='centralNotifBanner';
  banner.setAttribute('style','position:fixed;top:0;left:0;right:0;z-index:9999;background:'+color+';color:white;padding:12px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;animation:slideDown .3s ease;box-shadow:0 4px 20px rgba(0,0,0,.3)');
  var closeBtn=document.createElement('button');closeBtn.textContent='✕';closeBtn.setAttribute('style','background:none;border:none;color:white;font-size:18px;cursor:pointer;margin-left:auto;flex-shrink:0');closeBtn.onclick=function(e){e.stopPropagation();banner.remove();};
  var inner=document.createElement('div');inner.innerHTML='<div style="font-weight:800;font-size:14px">'+title+'</div><div style="font-size:12px;opacity:.9;margin-top:2px">'+body+'</div>';
  banner.appendChild(inner);banner.appendChild(closeBtn);banner.onclick=function(){banner.remove();showTab(0);};
  document.body.appendChild(banner);
  if(autoDismiss>0)setTimeout(function(){var b=document.getElementById('centralNotifBanner');if(b)b.remove();},autoDismiss);
}

var msgPopupTimer=null;
function showMessagePopup(sender,message){
  var existing=document.getElementById('msgPopup');if(existing)existing.remove();
  if(msgPopupTimer)clearTimeout(msgPopupTimer);
  var popup=document.createElement('div');popup.id='msgPopup';
  popup.setAttribute('style','position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:9999;background:#0d1b3e;color:white;border-radius:16px;padding:14px 18px;min-width:280px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.4);cursor:pointer');
  var closeBtn=document.createElement('button');closeBtn.textContent='✕';closeBtn.setAttribute('style','position:absolute;top:12px;right:14px;background:none;border:none;color:#64748b;font-size:18px;cursor:pointer');closeBtn.onclick=function(e){e.stopPropagation();popup.remove();};
  var inner=document.createElement('div');inner.setAttribute('style','display:flex;align-items:flex-start;gap:12px;padding-right:24px');inner.innerHTML='<div style="font-size:24px;flex-shrink:0">💬</div><div><div style="font-size:12px;font-weight:700;color:#fbbf24;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">'+sender+'</div><div style="font-size:14px;line-height:1.4">'+message+'</div></div>';
  var hint=document.createElement('div');hint.textContent='Tryck för att öppna chatten';hint.setAttribute('style','font-size:11px;color:#4a6090;margin-top:8px;text-align:center');
  popup.appendChild(closeBtn);popup.appendChild(inner);popup.appendChild(hint);
  popup.onclick=function(){popup.remove();showTab(4);};
  document.body.appendChild(popup);
  msgPopupTimer=setTimeout(function(){var p=document.getElementById('msgPopup');if(p)p.remove();},8000);
}

function closeMsgPopup(id){var el=document.getElementById(id);if(el)el.remove();}
</script>
