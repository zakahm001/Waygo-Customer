<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waygo — Din Taxi</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Arial,sans-serif;background:#eef1f8;color:#0d1b3e;min-height:100vh}
    .screen{display:none;min-height:100vh;flex-direction:column}
    .screen.active{display:flex}
    #sLoad{background:#0d1b3e;align-items:center;justify-content:center;gap:12px}
    .load-logo{font-size:64px;color:#fbbf24;animation:bounce 1s infinite}
    .load-name{color:#fbbf24;font-size:28px;font-weight:bold;letter-spacing:4px}
    .load-sub{color:#4a6090;font-size:13px}
    .dots{display:flex;gap:8px;margin-top:12px}
    .dot{width:10px;height:10px;background:#fbbf24;border-radius:50%;animation:dp 1.2s infinite}
    .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes dp{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
    #sWelcome{background:#0d1b3e;align-items:center;justify-content:center;padding:30px 24px}
    .w-logo{font-size:56px;color:#fbbf24;text-align:center}
    .w-name{color:#fbbf24;font-size:30px;font-weight:bold;letter-spacing:4px;text-align:center;margin-bottom:6px}
    .w-sub{color:#4a6090;font-size:14px;text-align:center;margin-bottom:40px}
    .w-btn{width:100%;max-width:400px;padding:22px 20px;border-radius:14px;
      font-weight:700;border:none;cursor:pointer;margin-bottom:16px;
      text-align:left;display:flex;align-items:center;gap:16px}
    .w-btn-now{background:white;color:#0d1b3e}
    .w-btn-pre{background:#1a2f5e;color:white;border:2px solid #2a4080}
    .w-btn-icon{font-size:28px;flex-shrink:0}
    .w-btn-title{font-size:17px;font-weight:800}
    .w-btn-sub{font-size:12px;opacity:.7;margin-top:2px}
    .w-langs{display:flex;gap:10px;margin-top:20px}
    .lang-btn{background:#1a2f5e;border:1px solid #2a4080;color:#94a3b8;
      padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;font-weight:600}
    .lang-btn.active{background:#fbbf24;color:#0d1b3e;border-color:#fbbf24}
    .topbar{background:#0d1b3e;padding:14px 20px;display:flex;align-items:center;
      justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid #1a2f5e}
    .tlogo{color:#fbbf24;font-size:18px;font-weight:bold;cursor:pointer}
    .tright{display:flex;align-items:center;gap:8px}
    .tauth{color:#fbbf24;font-size:12px;cursor:pointer;background:#1a2f5e;
      padding:6px 12px;border-radius:8px;border:none;font-weight:700}
    .tlang{color:#4a6090;font-size:18px;cursor:pointer;background:none;border:none;padding:4px}
    .bnav{position:fixed;bottom:0;left:0;right:0;background:#0d1b3e;
      display:flex;justify-content:space-around;padding:10px 0;
      border-top:1px solid #1a2f5e;z-index:100}
    .bni{display:flex;flex-direction:column;align-items:center;gap:3px;
      color:#4a6090;font-size:10px;cursor:pointer;border:none;background:none}
    .bni.active{color:#fbbf24}
    .bni-icon{font-size:20px}
    .bspace{height:80px}
    .page{padding:20px;flex:1;overflow-y:auto}
    .card{background:white;border-radius:14px;padding:18px;margin-bottom:14px;
      border:1px solid #d0d7ea;box-shadow:0 1px 4px rgba(0,0,0,.06)}
    .stitle{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;
      letter-spacing:1.5px;margin-bottom:10px}
    .flabel{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;
      letter-spacing:1px;margin-bottom:5px;display:block}
    .finput{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #d0d7ea;
      background:#f8fafc;color:#0d1b3e;font-size:15px;outline:none;
      box-sizing:border-box;transition:border-color .2s;margin-bottom:14px}
    .finput:focus{border-color:#0d1b3e}
    .finput::placeholder{color:#94a3b8}
    select.finput{appearance:none}
    .dt-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .pre-badge{background:#dbeafe;border:1px solid #93c5fd;border-radius:10px;
      padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .btn{padding:14px;border-radius:10px;font-size:15px;font-weight:700;
      border:none;cursor:pointer;width:100%;text-align:center;transition:opacity .2s}
    .btn:disabled{opacity:.6;cursor:default}
    .btn-primary{background:#0d1b3e;color:#fbbf24}
    .btn-success{background:#15803d;color:white}
    .btn-danger{background:#dc2626;color:white}
    .btn-teal{background:#0d9488;color:white}
    .btn-gray{background:#f1f5f9;color:#64748b}
    .btn-sm{padding:8px 14px;font-size:12px;width:auto;border-radius:8px}
    .badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
    .b-green{background:#dcfce7;color:#15803d;border:1px solid #86efac}
    .b-yellow{background:#fef3c7;color:#d97706;border:1px solid #fde68a}
    .b-red{background:#fee2e2;color:#dc2626;border:1px solid #fecaca}
    .b-gray{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0}
    .b-blue{background:#dbeafe;color:#1a56db;border:1px solid #93c5fd}
    .b-purple{background:#ede9fe;color:#7c3aed;border:1px solid #ddd6fe}
    .avatar{width:56px;height:56px;border-radius:50%;background:#0d1b3e;
      color:#fbbf24;display:flex;align-items:center;justify-content:center;
      font-size:22px;font-weight:bold;flex-shrink:0}
    .pgrid{display:grid;gap:8px;margin-bottom:14px}
    .pgrid-2{grid-template-columns:1fr 1fr}
    .pgrid-3{grid-template-columns:1fr 1fr 1fr}
    .pbtn{padding:12px 6px;border-radius:10px;border:2px solid #d0d7ea;
      background:white;color:#64748b;font-size:12px;font-weight:700;
      cursor:pointer;text-align:center;transition:all .15s}
    .pbtn.active{border-color:#0d1b3e;background:#0d1b3e;color:#fbbf24}
    .farebox{background:#f0f3f9;border-radius:10px;padding:14px;
      display:flex;justify-content:space-between;align-items:center;
      border:1px solid #d0d7ea;margin-bottom:14px}
    .fare-amt{font-size:24px;font-weight:bold;color:#0d1b3e}
    .mmap{background:#d4e8d4;border-radius:10px;height:130px;position:relative;
      overflow:hidden;margin-bottom:10px;border:1px solid #b8d4b8}
    .mmap-bg{position:absolute;inset:0;
      background-image:linear-gradient(#b8d4b8 1px,transparent 1px),
      linear-gradient(90deg,#b8d4b8 1px,transparent 1px);
      background-size:20px 20px;opacity:.5}
    .mroad-h{position:absolute;height:4px;background:white;left:0;right:0;opacity:.8}
    .mroad-v{position:absolute;width:4px;background:white;top:0;bottom:0;opacity:.8}
    .dmarker{position:absolute;width:30px;height:30px;border-radius:50%;
      background:#0d1b3e;border:3px solid #fbbf24;display:flex;align-items:center;
      justify-content:center;font-size:13px;transform:translate(-50%,-50%);
      transition:left 2s ease,top 2s ease;box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .cmarker{position:absolute;width:22px;height:22px;border-radius:50%;
      background:#1a56db;border:3px solid white;display:flex;align-items:center;
      justify-content:center;font-size:10px;transform:translate(-50%,-50%)}
    .map-eta{position:absolute;top:6px;right:6px;background:#0d1b3e;color:#fbbf24;
      border-radius:6px;padding:3px 8px;font-size:10px;font-weight:bold}
    .map-live{position:absolute;bottom:6px;left:6px;background:rgba(255,255,255,.9);
      border-radius:6px;padding:2px 7px;font-size:10px;color:#0d1b3e;font-weight:bold}
    .stars{display:flex;gap:6px;justify-content:center;margin:8px 0}
    .star{font-size:28px;cursor:pointer;color:#d0d7ea;transition:color .15s}
    .star.active{color:#fbbf24}
    .moverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
      z-index:200;align-items:flex-end;justify-content:center}
    .moverlay.open{display:flex}
    .mbox{background:white;border-radius:20px 20px 0 0;padding:24px 20px;
      width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
    .mtitle{font-size:17px;font-weight:bold;color:#0d1b3e;margin-bottom:16px}
    .minfo{background:#f0f3f9;border-radius:10px;padding:12px 14px;
      font-size:13px;color:#64748b;margin-bottom:14px;line-height:1.8}
    .minfo strong{color:#0d1b3e}
    .mbtns{display:flex;gap:10px}
    .mbtn{flex:1;padding:14px;border-radius:10px;font-size:14px;font-weight:bold;border:none;cursor:pointer}
    .auth-toggle{display:flex;background:#f0f3f9;border-radius:10px;padding:4px;margin-bottom:18px}
    .at-btn{flex:1;padding:10px;border:none;background:none;border-radius:8px;
      font-size:14px;font-weight:600;color:#64748b;cursor:pointer}
    .at-btn.active{background:white;color:#0d1b3e;box-shadow:0 1px 4px rgba(0,0,0,.1)}
    .type-toggle{display:flex;background:#f0f3f9;border-radius:10px;padding:4px;margin-bottom:14px}
    .chatbox{height:180px;overflow-y:auto;padding:8px 0;
      display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
    .cmsg{display:flex;gap:8px;align-items:flex-end}
    .cmsg.mine{flex-direction:row-reverse}
    .cav{width:26px;height:26px;border-radius:50%;background:#0d1b3e;color:#fbbf24;
      display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;flex-shrink:0}
    .cav.sup{background:#0d9488}
    .cbubble{max-width:72%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.4}
    .cmsg.mine .cbubble{background:#0d1b3e;color:#fbbf24;border-radius:12px 12px 4px 12px}
    .cmsg.other .cbubble{background:#f1f5f9;color:#0d1b3e;border-radius:12px 12px 12px 4px}
    .cinput-row{display:flex;gap:8px}
    .cinput{flex:1;padding:9px 12px;border-radius:24px;border:1px solid #d0d7ea;
      background:#f8fafc;font-size:13px;color:#0d1b3e;outline:none}
    .csend{width:38px;height:38px;border-radius:50%;background:#0d1b3e;
      border:none;color:#fbbf24;font-size:15px;cursor:pointer;flex-shrink:0}
    .toast{position:fixed;bottom:90px;left:20px;right:20px;background:#0d1b3e;
      color:#fbbf24;padding:14px 20px;border-radius:12px;font-size:14px;
      font-weight:bold;text-align:center;z-index:500;display:none;
      box-shadow:0 4px 20px rgba(0,0,0,.3)}
    .toast.show{display:block}
    .infobox{border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:10px}
    .ib-yellow{background:#fef3c7;border:1px solid #fde68a;color:#d97706}
    .ib-blue{background:#dbeafe;border:1px solid #93c5fd;color:#1a56db}
    .ib-red{background:#fee2e2;border:1px solid #fecaca;color:#dc2626}
    .ib-green{background:#dcfce7;border:1px solid #86efac;color:#15803d}
    .profile-header{background:linear-gradient(135deg,#0d1b3e,#1a3066);
      padding:24px 20px;display:flex;align-items:center;gap:16px;color:white}
    .list-item{display:flex;justify-content:space-between;align-items:center;
      padding:12px 0;border-bottom:1px solid #f8fafc;cursor:pointer}
    .list-item:last-child{border-bottom:none}
    .li-label{font-size:14px;color:#0d1b3e}
    .li-value{font-size:13px;color:#64748b;max-width:55%;text-align:right}
    .li-arrow{color:#94a3b8;font-size:16px;margin-left:6px}
    .hcard{background:white;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #d0d7ea}
    .hcard.urgent{border-color:#f97316;box-shadow:0 0 0 3px #fed7aa}
    .htop{display:flex;justify-content:space-between;margin-bottom:6px;align-items:center}
    .href{font-size:12px;font-weight:700;color:#1a56db}
    .hroute{font-size:13px;font-weight:600;color:#0d1b3e;margin-bottom:4px}
    .hdetail{font-size:11px;color:#64748b;margin-bottom:8px}
    .hfooter{display:flex;justify-content:space-between;align-items:center}
    .hfare{font-size:14px;font-weight:bold;color:#0d1b3e}
    .hvat{font-size:10px;color:#94a3b8;margin-top:1px}
    .tabbar{display:flex;background:white;border-bottom:1px solid #d0d7ea;padding:0 16px}
    .tab{flex:1;padding:13px 8px;text-align:center;font-size:13px;font-weight:500;
      color:#64748b;cursor:pointer;border-bottom:2.5px solid transparent;
      -webkit-tap-highlight-color:transparent;user-select:none}
    .tab.active{color:#0d1b3e;font-weight:700;border-bottom-color:#0d1b3e}
    .login-gate{background:linear-gradient(135deg,#0d1b3e,#1a3066);
      border-radius:12px;padding:24px;text-align:center;margin-bottom:14px;color:white}
    .gate-icon{font-size:36px;margin-bottom:8px}
    .gate-title{font-size:16px;font-weight:bold;margin-bottom:4px}
    .gate-sub{font-size:13px;color:#6b82b8;margin-bottom:16px}
  </style>
</head>
<body>

<!-- LOADING -->
<div class="screen active" id="sLoad">
  <div class="load-logo">▲</div>
  <div class="load-name">WAYGO</div>
  <div class="load-sub" id="loadSub">Din taxi, direkt</div>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>

<!-- WELCOME -->
<div class="screen" id="sWelcome">
  <div class="w-logo">▲</div>
  <div class="w-name">WAYGO</div>
  <div class="w-sub" id="wSub">Sveriges snabbaste taxi</div>
  <button class="w-btn w-btn-now" onclick="startBook('now')">
    <div class="w-btn-icon">🚖</div>
    <div><div class="w-btn-title" id="wNow">Jag behöver en bil nu</div><div class="w-btn-sub" id="wNowS">Förare skickas direkt</div></div>
    <div style="margin-left:auto;font-size:20px;color:#94a3b8">›</div>
  </button>
  <button class="w-btn w-btn-pre" onclick="startBook('pre')">
    <div class="w-btn-icon">📅</div>
    <div><div class="w-btn-title" id="wPre">Jag vill förboka</div><div class="w-btn-sub" id="wPreS">Välj datum och tid</div></div>
    <div style="margin-left:auto;font-size:20px;color:#6b82b8">›</div>
  </button>
  <div class="w-langs">
    <button class="lang-btn active" id="lSV" onclick="setLang('sv')">🇸🇪 Svenska</button>
    <button class="lang-btn" id="lEN" onclick="setLang('en')">🇬🇧 English</button>
  </div>
</div>

<!-- MAIN APP -->
<div class="screen" id="sApp">
  <div class="topbar">
    <div class="tlogo" onclick="showScreen('sWelcome')">▲ WAYGO</div>
    <div class="tright">
      <button class="tlang" id="langBtn" onclick="toggleLang()">🇬🇧</button>
      <button class="tauth" id="topBtn" onclick="topAction()">Logga in</button>
    </div>
  </div>
  <div style="flex:1;overflow-y:auto" id="tabContent"></div>
  <div class="bnav">
    <button class="bni active" id="bni0" onclick="showTab(0)"><span class="bni-icon">🚖</span><span id="nt0">Boka</span></button>
    <button class="bni" id="bni1" onclick="showTab(1)"><span class="bni-icon">📋</span><span id="nt1">Resor</span></button>
    <button class="bni" id="bni2" onclick="showTab(2)"><span class="bni-icon">👤</span><span id="nt2">Profil</span></button>
    <button class="bni" id="bni3" onclick="showTab(3)"><span class="bni-icon">💳</span><span id="nt3">Betalning</span></button>
  </div>
</div>

<!-- AUTH MODAL -->
<div class="moverlay" id="authModal">
  <div class="mbox">
    <div id="pendingSummary" style="display:none"><div class="infobox ib-blue" id="pendingInfo"></div></div>
    <div class="auth-toggle">
      <button class="at-btn active" id="atL" onclick="switchAuth('login')">Logga in</button>
      <button class="at-btn" id="atR" onclick="switchAuth('reg')">Ny kund</button>
    </div>
    <div id="loginForm">
      <div class="mtitle" id="loginTitle">Välkommen tillbaka</div>
      <label class="flabel">E-postadress</label>
      <input class="finput" id="lEmail" type="email" placeholder="din@email.se"/>
      <label class="flabel">Lösenord</label>
      <input class="finput" id="lPwd" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
      <div class="infobox ib-red" id="lErr" style="display:none"></div>
      <button class="btn btn-primary" id="lBtn" onclick="doLogin()">Logga in →</button>
      <div style="text-align:center;margin-top:10px;font-size:12px;color:#94a3b8">BankID &amp; SMS kommer snart</div>
    </div>
    <div id="regForm" style="display:none">
      <div class="mtitle">Skapa konto</div>
      <div class="type-toggle">
        <button class="at-btn active" id="tPri" onclick="switchType('private')">👤 Privat</button>
        <button class="at-btn" id="tBiz" onclick="switchType('business')">🏢 Företag</button>
      </div>
      <label class="flabel">Fullständigt namn *</label>
      <input class="finput" id="rName" type="text" placeholder="För- och efternamn"/>
      <label class="flabel">Telefon *</label>
      <input class="finput" id="rPhone" type="tel" placeholder="070-000 00 00"/>
      <label class="flabel">E-post *</label>
      <input class="finput" id="rEmail" type="email" placeholder="din@email.se"/>
      <label class="flabel">Lösenord * (minst 6 tecken)</label>
      <input class="finput" id="rPwd" type="password" placeholder="••••••••"/>
      <div id="bizF" style="display:none">
        <label class="flabel">Organisationsnummer</label>
        <input class="finput" id="rOrg" type="text" placeholder="556xxx-xxxx"/>
        <label class="flabel">Faktureringsadress</label>
        <input class="finput" id="rBill" type="text" placeholder="Gatuadress, stad"/>
      </div>
      <label class="flabel">Betalningsmetod</label>
      <select class="finput" id="rPay"><option value="swish">📱 Swish</option><option value="card">💳 Kort</option></select>
      <div class="infobox ib-red" id="rErr" style="display:none"></div>
      <button class="btn btn-primary" id="rBtn" onclick="doRegister()">Skapa konto →</button>
    </div>
    <button class="btn btn-gray" style="margin-top:10px" onclick="closeMod('authModal')">Avbryt</button>
  </div>
</div>

<!-- SUPPORT MODAL -->
<div class="moverlay" id="suppModal" onclick="closeMIfOut(event,'suppModal')">
  <div class="mbox">
    <div class="mtitle">📞 Kundtjänst · Waygo</div>
    <div class="minfo" id="suppInfo"></div>
    <a href="tel:+46101234567" style="text-decoration:none;display:block;margin-bottom:12px">
      <button class="btn btn-success">📞 Ring kundtjänst direkt</button>
    </a>
    <div class="chatbox" id="suppChat"></div>
    <div class="cinput-row">
      <input class="cinput" id="suppInput" placeholder="Beskriv ditt problem..." onkeydown="if(event.key==='Enter')sendSupp()"/>
      <button class="csend" onclick="sendSupp()">➤</button>
    </div>
    <div class="infobox ib-yellow" style="margin-top:10px">⚠️ Kontakta kundtjänst innan du avbokar en tilldelad resa.</div>
    <button class="btn btn-gray" style="margin-top:10px" onclick="closeMod('suppModal')">Stäng</button>
  </div>
</div>

<!-- CANCEL MODAL -->
<div class="moverlay" id="cancelModal" onclick="closeMIfOut(event,'cancelModal')">
  <div class="mbox">
    <div class="mtitle">Bekräfta avbokning</div>
    <div class="infobox ib-red" id="cancelWarn"></div>
    <div class="minfo" id="cancelInfo"></div>
    <div class="mbtns">
      <button class="mbtn" style="background:#f1f5f9;color:#64748b" onclick="closeMod('cancelModal')">Avbryt</button>
      <button class="mbtn" style="background:#dc2626;color:white" onclick="doCancel()">Avboka</button>
    </div>
  </div>
</div>

<!-- RATE MODAL -->
<div class="moverlay" id="rateModal" onclick="closeMIfOut(event,'rateModal')">
  <div class="mbox">
    <div class="mtitle">⭐ Betygsätt din resa</div>
    <div class="minfo" id="rateInfo"></div>
    <div class="stars">
      <span class="star" onclick="setStar(1)">★</span>
      <span class="star" onclick="setStar(2)">★</span>
      <span class="star" onclick="setStar(3)">★</span>
      <span class="star" onclick="setStar(4)">★</span>
      <span class="star" onclick="setStar(5)">★</span>
    </div>
    <button class="btn btn-primary" onclick="submitRate()">Skicka betyg</button>
    <button class="btn btn-gray" style="margin-top:8px" onclick="closeMod('rateModal')">Hoppa över</button>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="moverlay" id="editModal" onclick="closeMIfOut(event,'editModal')">
  <div class="mbox">
    <div class="mtitle" id="editTitle">Redigera</div>
    <input class="finput" id="editInput" type="text"/>
    <div class="mbtns">
      <button class="mbtn" style="background:#f1f5f9;color:#64748b" onclick="closeMod('editModal')">Avbryt</button>

function t(k) {
  try { return TR[lang][k] || TR.sv[k] || k; } catch(e) { return k; }
}

// ── LANGUAGE ──
function setLang(l) {
  lang = l;
  localStorage.setItem('wlang', l);
  try {
    document.getElementById('lSV').classList.toggle('active', l==='sv');
    document.getElementById('lEN').classList.toggle('active', l==='en');
    document.getElementById('loadSub').textContent = t('sub');
    document.getElementById('wSub').textContent = t('wsub');
    document.getElementById('wNow').textContent = t('wnow');
    document.getElementById('wNowS').textContent = t('wnows');
    document.getElementById('wPre').textContent = t('wpre');
    document.getElementById('wPreS').textContent = t('wpres');
    document.getElementById('langBtn').textContent = l==='sv'?'🇬🇧':'🇸🇪';
  } catch(e){}
}

function toggleLang() {
  setLang(lang==='sv'?'en':'sv');
  updateTopbar();
  if (curTab!==undefined) showTab(curTab);
}

// ── INIT ──
window.addEventListener('load', () => {
  setLang(lang);
  setTimeout(() => {
    try {
      const sc = localStorage.getItem('waygo_support');
      if (sc) suppContacted = JSON.parse(sc);
      const saved = localStorage.getItem('waygo_customer');
      const savedTok = localStorage.getItem('waygo_token');
      if (saved && savedTok) {
        customer = JSON.parse(saved);
        token = savedTok;
        selectedPay = customer.preferred_payment || 'swish';
        if (!isBiz() && selectedPay==='invoice') selectedPay='swish';
        updateTopbar();
        loadBookings();
        trySocket();
        showScreen('sApp');
        showTab(0);
      } else {
        showScreen('sWelcome');
      }
    } catch(e) {
      console.log('init error:', e);
      showScreen('sWelcome');
    }
  }, 2000);
});

function showScreen(id) {
  try {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const el = document.getElementById(id);
    if (el) el.classList.add('active');
  } catch(e){}
}

function showToast(msg) {
  try {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3500);
  } catch(e){}
}

function closeMod(id) {
  try { document.getElementById(id).classList.remove('open'); } catch(e){}
}

function closeMIfOut(e, id) {
  if (e.target === document.getElementById(id)) closeMod(id);
}

// ── WELCOME ──
function startBook(mode) {
  bookMode = mode;
  if (mode==='pre') {
    const t2 = new Date();
    t2.setDate(t2.getDate()+1);
    preDate = t2.toISOString().split('T')[0];
    preTime = '09:00';
  }
  showScreen('sApp');
  showTab(0);
}

// ── TOPBAR ──
function updateTopbar() {
  try {
    const btn = document.getElementById('topBtn');
    document.getElementById('langBtn').textContent = lang==='sv'?'🇬🇧':'🇸🇪';
    if (customer) {
      btn.textContent = customer.name.split(' ')[0];
      btn.onclick = () => showTab(2);
    } else {
      btn.textContent = t('login');
      btn.onclick = topAction;
    }
    ['nt0','nt1','nt2','nt3'].forEach((id,i) => {
      const el = document.getElementById(id);
      if (el) el.textContent = t(['book','rides','profile','pay'][i]);
    });
  } catch(e){}
}

function topAction() {
  if (customer) { showTab(2); return; }
  openAuth(null);
}

// ── BUSINESS CHECK ──
function isBiz() { return customer && customer.customer_type==='business'; }

// ── PAYMENT GRID ──
function payGrid() {
  if (!isBiz() && selectedPay==='invoice') selectedPay='swish';
  const opts = [{id:'swish',l:t('swish')},{id:'card',l:t('card')}];
  if (isBiz()) opts.push({id:'invoice',l:t('invoice')});
  let h = '<div class="pgrid ' + (opts.length===3?'pgrid-3':'pgrid-2') + '">';
  opts.forEach(o => {
    h += '<button class="pbtn '+(selectedPay===o.id?'active':'')+'" onclick="setPay(\''+o.id+'\')">'+o.l+'</button>';
  });
  h += '</div>';
  if (selectedPay==='invoice' && isBiz()) h += '<div class="infobox ib-yellow">'+t('inv_biz')+'</div>';
  return h;
}

function setPay(m) {
  if (m==='invoice' && !isBiz()) { showToast(t('inv_priv')); return; }
  selectedPay = m;
  showTab(0);
}

// ── TABS ──
function showTab(i) {
  try {
    curTab = i;
    document.querySelectorAll('.bni').forEach((b,j) => b.classList.toggle('active', i===j));
    const c = document.getElementById('tabContent');
    if (!c) return;
    if (i===0) c.innerHTML = tabBook();
    else if (i===1) { c.innerHTML = tabRides(); loadBookings(); }
    else if (i===2) c.innerHTML = tabProfile();
    else if (i===3) c.innerHTML = tabPay();
    updateTopbar();
  } catch(e) { console.log('showTab error:', e); }
}

// ── BOOK TAB ──
function tabBook() {
  const ha = customer?.home_address||'';
  const wa = customer?.work_address||'';
  const isPre = bookMode==='pre';
  const today = new Date().toISOString().split('T')[0];
  const max = new Date(); max.setDate(max.getDate()+30);
  const maxS = max.toISOString().split('T')[0];
  return `
    <div style="background:linear-gradient(135deg,#0d1b3e,#1a3066);padding:20px 20px 24px;color:white">
      <div style="font-size:20px;font-weight:bold;margin-bottom:4px">${t('btitle')}</div>
      <div style="color:#6b82b8;font-size:13px">${t('bsub')}</div>
    </div>
    <div class="page">
      <div class="card">
        ${isPre?`
        <div class="pre-badge">
          <div style="font-size:20px">📅</div>
          <div style="font-size:13px;color:#1a56db;font-weight:600">${t('prebadge')}</div>
          <div style="font-size:11px;color:#1a56db;text-decoration:underline;cursor:pointer;margin-left:auto" onclick="bookMode='now';showTab(0)">${t('prechange')} →</div>
        </div>
        <div class="dt-row">
          <div>
            <label class="flabel">${t('predate')}</label>
            <input class="finput" type="date" id="pDate" value="${preDate}" min="${today}" max="${maxS}" onchange="preDate=this.value" style="margin-bottom:0"/>
          </div>
          <div>
            <label class="flabel">${t('pretime')}</label>
            <input class="finput" type="time" id="pTime" value="${preTime}" onchange="preTime=this.value" style="margin-bottom:0"/>
          </div>
        </div>`:''}
        <label class="flabel">📍 ${t('pickup')}</label>
        <input class="finput" id="bFrom" type="text" placeholder="${t('pickup')}..." value="${ha}"/>
        <label class="flabel">🏁 ${t('dest')}</label>
        <input class="finput" id="bTo" type="text" placeholder="${t('dest')}?" onblur="calcFare()"/>
        ${customer&&(ha||wa)?`
        <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
          ${ha?'<button class="btn btn-sm btn-gray" onclick="sAddr(\'bFrom\',\''+ha+'\')">'+t('fhome')+'</button>':''}
          ${wa?'<button class="btn btn-sm btn-gray" onclick="sAddr(\'bFrom\',\''+wa+'\')">'+t('fwork')+'</button>':''}
          ${ha?'<button class="btn btn-sm btn-gray" onclick="sAddr(\'bTo\',\''+ha+'\')">'+t('thome')+'</button>':''}
          ${wa?'<button class="btn btn-sm btn-gray" onclick="sAddr(\'bTo\',\''+wa+'\')">'+t('twork')+'</button>':''}
        </div>`:''}
        <label class="flabel">💳 ${t('paymethod')}</label>
        ${payGrid()}
        <div class="farebox">
          <div>
            <div style="font-size:13px;color:#64748b">${t('estcost')}</div>
            <div style="font-size:11px;color:#94a3b8;margin-top:2px">${t('vat')}</div>
          </div>
          <div class="fare-amt" id="fareAmt">150 kr</div>
        </div>
        ${!customer?'<div class="infobox ib-blue" style="margin-bottom:14px">ℹ️ '+(lang==='sv'?'Logga in för att slutföra bokningen.':'Log in to complete your booking.')+'</div>':''}
        <button class="btn btn-primary" id="bookBtn" onclick="tryBook()">${customer?t('bookbtn'):t('contbtn')}</button>
      </div>
      <div class="bspace"></div>
    </div>`;
}

function sAddr(id, v) { const e=document.getElementById(id); if(e) e.value=v; }

function calcFare() {
  const f=document.getElementById('bFrom')?.value;
  const t2=document.getElementById('bTo')?.value;
  if (f&&t2) { const e=document.getElementById('fareAmt'); if(e) e.textContent=Math.floor(Math.random()*300+100)+' kr'; }
}

function tryBook() {
  const from=document.getElementById('bFrom')?.value.trim();
  const to=document.getElementById('bTo')?.value.trim();
  if (!from||!to) { showToast(t('fillfields')); return; }
  if (bookMode==='pre'&&(!preDate||!preTime)) { showToast(t('filldatetime')); return; }
  const fare=parseInt(document.getElementById('fareAmt')?.textContent)||150;
  if (!customer) {
    openAuth({from,to,pay:selectedPay,fare,
      pl:selectedPay==='swish'?t('swish'):selectedPay==='card'?t('card'):t('invoice'),
      mode:bookMode,date:preDate,time:preTime});
    return;
  }
  if (selectedPay==='invoice'&&!isBiz()) { showToast(t('inv_priv')); selectedPay='swish'; showTab(0); return; }
  doBook(from,to,fare);
}

async function doBook(from,to,fare) {
  const btn=document.getElementById('bookBtn');
  if (btn) { btn.textContent='...'; btn.disabled=true; }
  try {
    const body={customer_name:customer.name,customer_phone:customer.phone,
      from_address:from,to_address:to,payment_method:selectedPay,fare_sek:fare};
    if (bookMode==='pre'&&preDate&&preTime) {
      body.scheduled_at=preDate+'T'+preTime+':00';
      body.booking_type='pre';
    }
    const res=await fetch(API+'/bookings',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await res.json();
    if (data.booking) {
      myBookings.unshift(data.booking);
      saveBooks();
      bookMode='now';
      showToast(t('booked')+' '+data.booking.booking_ref);
      showTab(1);
    }
  } catch(e) { showToast(t('bookfail')); }
  if (btn) { btn.textContent=t('bookbtn'); btn.disabled=false; }
}

// ── AUTH ──
function openAuth(pending) {
  pendingBook = pending;
  const sum=document.getElementById('pendingSummary');
  const inf=document.getElementById('pendingInfo');
  if (pending) {
    sum.style.display='';
    const ds=pending.mode==='pre'&&pending.date?'<br>📅 '+pending.date+' kl. '+pending.time:'';
    inf.innerHTML='<strong>'+t('pendtitle')+'</strong><br>📍 '+pending.from+' → 🏁 '+pending.to+'<br>💳 '+pending.pl+' · '+pending.fare+' kr'+ds+'<br><strong>'+t('pendcomplete')+'</strong>';
  } else { sum.style.display='none'; }
  document.getElementById('atL').textContent=t('login');
  document.getElementById('atR').textContent=t('signup');
  document.getElementById('lBtn').textContent=t('loginbtn');
  document.getElementById('rBtn').textContent=t('regbtn');
  switchAuth('login');
  document.getElementById('authModal').classList.add('open');
}

function switchAuth(m) {
  document.getElementById('loginForm').style.display=m==='login'?'':'none';
  document.getElementById('regForm').style.display=m==='reg'?'':'none';
  document.getElementById('atL').classList.toggle('active',m==='login');
  document.getElementById('atR').classList.toggle('active',m==='reg');
}

function switchType(tp) {
  custType=tp;
  document.getElementById('tPri').classList.toggle('active',tp==='private');
  document.getElementById('tBiz').classList.toggle('active',tp==='business');
  document.getElementById('bizF').style.display=tp==='business'?'':'none';
  const sel=document.getElementById('rPay');
  if (sel) sel.innerHTML='<option value="swish">'+t('swish')+'</option><option value="card">'+t('card')+'</option>'+(tp==='business'?'<option value="invoice">'+t('invoice')+'</option>':'');
}

async function doLogin() {
  const email=document.getElementById('lEmail').value.trim();
  const pwd=document.getElementById('lPwd').value.trim();
  const err=document.getElementById('lErr');
  const btn=document.getElementById('lBtn');
  err.style.display='none';
  if (!email||!pwd) { err.textContent=t('fill'); err.style.display=''; return; }
  btn.textContent=t('loggingin'); btn.disabled=true;
  try {
    const res=await fetch(API+'/customers/login',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pwd})});
    const data=await res.json();
    if (data.token) {
      customer=data.customer; token=data.token;
      localStorage.setItem('waygo_customer',JSON.stringify(customer));
      localStorage.setItem('waygo_token',token);
      closeMod('authModal');
      selectedPay=customer.preferred_payment||'swish';
      if (!isBiz()&&selectedPay==='invoice') selectedPay='swish';
      updateTopbar(); loadBookings(); trySocket();
      showToast(t('welcome')+' '+customer.name.split(' ')[0]+'!');
      if (pendingBook) await completePending();
      else showTab(0);
    } else { err.textContent='⚠️ '+(data.error||t('servererr')); err.style.display=''; }
  } catch(e) { err.textContent=t('servererr'); err.style.display=''; }
  btn.textContent=t('loginbtn'); btn.disabled=false;
}

async function doRegister() {
  const name=document.getElementById('rName').value.trim();
  const phone=document.getElementById('rPhone').value.trim();
  const email=document.getElementById('rEmail').value.trim();
  const pwd=document.getElementById('rPwd').value.trim();
  const err=document.getElementById('rErr');
  const btn=document.getElementById('rBtn');
  err.style.display='none';
  if (!name||!phone||!email||!pwd) { err.textContent=t('fill'); err.style.display=''; return; }
  if (pwd.length<6) { err.textContent=t('short'); err.style.display=''; return; }
  btn.textContent=t('creating'); btn.disabled=true;
  try {
    const pv=document.getElementById('rPay').value;
    const fp=(pv==='invoice'&&custType!=='business')?'swish':pv;
    const res=await fetch(API+'/customers/register',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,phone,email,password:pwd,customer_type:custType,
        preferred_payment:fp,org_number:document.getElementById('rOrg')?.value||null,
        billing_address:document.getElementById('rBill')?.value||null})});
    const data=await res.json();
    if (data.token) {
      customer=data.customer; token=data.token;
      localStorage.setItem('waygo_customer',JSON.stringify(customer));
      localStorage.setItem('waygo_token',token);
      closeMod('authModal'); selectedPay=customer.preferred_payment||'swish';
      updateTopbar(); trySocket();
      showToast(t('created')+' '+customer.name.split(' ')[0]+'!');
      if (pendingBook) await completePending();
      else showTab(0);
    } else { err.textContent='⚠️ '+(data.error||t('servererr')); err.style.display=''; }
  } catch(e) { err.textContent=t('servererr'); err.style.display=''; }
  btn.textContent=t('regbtn'); btn.disabled=false;
}

async function completePending() {
  if (!pendingBook||!customer) return;
  let pm=pendingBook.pay;
  if (pm==='invoice'&&!isBiz()) { pm='swish'; showToast(t('inv_priv')); }
  showToast(t('completing'));
  try {
    const body={customer_name:customer.name,customer_phone:customer.phone,
      from_address:pendingBook.from,to_address:pendingBook.to,
      payment_method:pm,fare_sek:pendingBook.fare};
    if (pendingBook.mode==='pre'&&pendingBook.date) {
      body.scheduled_at=pendingBook.date+'T'+pendingBook.time+':00';
      body.booking_type='pre';
    }
    const res=await fetch(API+'/bookings',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await res.json();
    if (data.booking) {
      myBookings.unshift(data.booking); saveBooks();
      pendingBook=null; bookMode='now';
      showToast(t('booked')+' '+data.booking.booking_ref);
      showTab(1);
    }
  } catch(e) { showToast(t('compfail')); showTab(0); }
}

  updateTopbar();

  showScreen('sWelcome');
}

function badge(status) {
  const m={
    assigned:'<span class="badge b-green">'+t('assigned')+'</span>',
    pending:'<span class="badge b-yellow">'+t('finding')+'</span>',
    cancelled:'<span class="badge b-red">'+t('cancelled')+'</span>',

function minsAgo(ts) {
  if (!ts) return 0;
  return Math.floor((Date.now()-new Date(ts).getTime())/60000);
}

function activeCards(books) {
  if (!books.length) return '<div style="text-align:center;padding:40px;color:#94a3b8;font-size:13px">'+t('noactive')+'</div>';
  return books.map(b => {
    const mins=minsAgo(b.assigned_at);
    const isLate=b.status==='assigned'&&mins>=10;
    const hasSup=suppContacted[b.id];
    const isPre=b.booking_type==='pre';
    let map='';
    if (b.status==='assigned'&&b.driver_name) {
      map=`<div class="mmap">
        <div class="mmap-bg"></div>
        <div class="mroad-h" style="top:35%"></div><div class="mroad-h" style="top:65%"></div>
        <div class="mroad-v" style="left:30%"></div><div class="mroad-v" style="left:65%"></div>
        <div class="dmarker" id="dm-${b.id}" style="left:30%;top:30%">🚖</div>
        <div class="cmarker" style="left:70%;top:65%">👤</div>
        <div class="map-eta">~${Math.max(1,12-mins)} min</div>
        <div class="map-live">🔴 Live</div>
      </div>`;
      setTimeout(()=>animDrv(b.id),100);
    }
    let cancelBtn='';
    if (b.status==='pending') {
      cancelBtn='<button class="btn btn-sm btn-danger" onclick="openCancel('+b.id+',\''+b.booking_ref+'\',\'pending\')">'+t('cancelride')+'</button>';
    } else if (hasSup) {
      cancelBtn='<button class="btn btn-sm btn-danger" onclick="openCancel('+b.id+',\''+b.booking_ref+'\',\'assigned\')">'+t('cancelreq')+'</button>';
    } else if (b.status==='assigned') {
      cancelBtn='<button class="btn btn-sm btn-teal" onclick="openSupp('+b.id+',\''+b.booking_ref+'\')">'+t('consupport')+'</button>';
    }
    return `<div class="hcard ${isLate?'urgent':''}">
      <div class="htop">
        <span class="href">${b.booking_ref}</span>
        <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">
          ${isPre?'<span class="badge b-purple">'+t('prebook')+'</span>':''}
          ${badge(b.status)}
        </div>
      </div>
      ${isPre&&b.scheduled_at?'<div style="font-size:11px;color:#7c3aed;font-weight:700;margin-bottom:4px">📅 '+new Date(b.scheduled_at).toLocaleString(lang==='sv'?'sv-SE':'en-GB',{dateStyle:'medium',timeStyle:'short'})+'</div>':''}
      <div class="hroute">📍 ${b.from_address} → 🏁 ${b.to_address}</div>
      <div class="hdetail">${b.driver_name?'🚖 '+b.driver_name+' · ':t('looking')+' · '}${b.fare_sek} kr · ${b.payment_method}</div>
      ${isLate?'<div class="infobox ib-red">⏱ '+t('late')+' '+mins+' '+t('latemin')+'</div>':''}
      ${map}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
        ${b.status==='assigned'?'<button class="btn btn-sm btn-primary" onclick="openSupp('+b.id+',\''+b.booking_ref+'\')">'+t('support')+'</button>':''}
        ${cancelBtn}
      </div>
    </div>`;
  }).join('');
}

  if (!books.length) return '<div style="text-align:center;padding:40px;color:#94a3b8;font-size:13px">'+t('nohistory')+'</div>';
  return books.map(b => {

async function saveEdit() {
  const val=document.getElementById('editInput').value.trim();

  try {
    if (editField==='preferred_payment'&&val==='invoice'&&!isBiz()) { showToast(t('inv_priv')); return; }
    const body={}; body[editField]=val;
    const res=await fetch(API+'/customers/profile',{method:'PATCH',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify(body)});
    const data=await res.json();
    if (data.customer) {
      customer={...customer,...data.customer};
      localStorage.setItem('waygo_customer',JSON.stringify(customer));
      showToast(t('saved')); showTab(2);
    }
  } catch(e) { showToast(t('savefail')); }

// ── DRIVER ANIMATION ──
function animDrv(id) {
  if (driverAnims[id]) return;
  let x=30; let y=30;
  driverAnims[id]=setInterval(()=>{
    x=Math.min(75,Math.max(15,x+(Math.random()-.4)*8));
    y=Math.min(75,Math.max(15,y+(Math.random()-.4)*8));
    const m=document.getElementById('dm-'+id);
    if (m) { m.style.left=x+'%'; m.style.top=y+'%'; }
  },3000);
}

// ── DATA ──
async function loadBookings() {
  if (!customer) return;
  const sv=localStorage.getItem('waygo_bookings');
  if (sv) { try { myBookings=JSON.parse(sv); } catch(e){} }
  try {
    const res=await fetch(API+'/bookings');
    const data=await res.json();
    myBookings=myBookings.map(mb=>{
      const u=data.bookings.find(b=>b.id===mb.id);
      return u||mb;
    });
    saveBooks();
    if (curTab===1) showTab(1);
    if (curTab===3) showTab(3);
  } catch(e){}
}

function saveBooks() {
  localStorage.setItem('waygo_bookings',JSON.stringify(myBookings));
}

// ── SOCKET ──
function trySocket() {
  try {
    if (typeof io==='undefined') return;
    const s=io(API,{timeout:5000});
    s.on('booking:assigned',b=>{
      myBookings=myBookings.map(mb=>mb.id===b.id?{...mb,...b}:mb);
      saveBooks();
      if (b.driver_name) showToast(t('driverassigned')+' '+b.driver_name);
      if (curTab===1) showTab(1);
    });
    s.on('booking:cancelled',d=>{
      myBookings=myBookings.map(b=>b.id===d.id?{...b,status:'cancelled'}:b);
      saveBooks();
      if (curTab===1) showTab(1);
    });
  } catch(e){}
}

setInterval(loadBookings, 30000);
</script>
