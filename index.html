<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waygo — Din Taxi</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Arial,sans-serif;background:#eef1f8;color:#0d1b3e;min-height:100vh}
    .screen{display:none;min-height:100vh;flex-direction:column}
    .screen.active{display:flex}
    #sLoad{background:#0d1b3e;align-items:center;justify-content:center;gap:12px}
    .load-logo{font-size:64px;color:#fbbf24;animation:bounce 1s infinite}
    .load-name{color:#fbbf24;font-size:28px;font-weight:bold;letter-spacing:4px}
    .load-sub{color:#4a6090;font-size:13px}
    .dots{display:flex;gap:8px;margin-top:12px}
    .dot{width:10px;height:10px;background:#fbbf24;border-radius:50%;animation:dp 1.2s infinite}
    .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes dp{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
    .topbar{background:#0d1b3e;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid #1a2f5e}
    .tlogo{color:#fbbf24;font-size:18px;font-weight:bold;cursor:pointer}
    .topbar-right{display:flex;align-items:center;gap:8px}
    .tauth{color:#fbbf24;font-size:12px;cursor:pointer;background:#1a2f5e;padding:6px 12px;border-radius:8px;border:none;font-weight:700}
    .tlang{color:#4a6090;font-size:18px;cursor:pointer;background:none;border:none;padding:4px}
    .bnav{position:fixed;bottom:0;left:0;right:0;background:#0d1b3e;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #1a2f5e;z-index:100}
    .bni{display:flex;flex-direction:column;align-items:center;gap:3px;color:#4a6090;font-size:10px;cursor:pointer;border:none;background:none}
    .bni.active{color:#fbbf24}
    .bni-icon{font-size:20px}
    .bspace{height:80px}
    .page{padding:20px;flex:1;overflow-y:auto}
    .card{background:white;border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid #d0d7ea;box-shadow:0 1px 4px rgba(0,0,0,.06)}
    .stitle{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
    .flabel{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;display:block}
    .finput{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #d0d7ea;background:#f8fafc;color:#0d1b3e;font-size:15px;outline:none;box-sizing:border-box;transition:border-color .2s;margin-bottom:14px}
    .btn{padding:14px;border-radius:10px;font-size:15px;font-weight:700;border:none;cursor:pointer;width:100%;text-align:center}
    .btn-primary{background:#0d1b3e;color:#fbbf24}
    .btn-gray{background:#f1f5f9;color:#64748b}
    .hist-card{background:white;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #d0d7ea}
    .hist-top{display:flex;justify-content:space-between;margin-bottom:6px;align-items:center}
    .hist-ref{font-size:12px;font-weight:700;color:#1a56db}
    .hist-route{font-size:13px;font-weight:600;color:#0d1b3e;margin-bottom:4px}
    .badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
    .b-green{background:#dcfce7;color:#15803d;border:1px solid #86efac}
    .b-blue{background:#dbeafe;color:#1a56db;border:1px solid #93c5fd}
    .b-red{background:#fee2e2;color:#dc2626;border:1px solid #fecaca}
    .tabbar{display:flex;background:white;border-bottom:1px solid #d0d7ea;padding:0 16px}
    .tab{flex:1;padding:13px 8px;text-align:center;font-size:13px;font-weight:500;color:#64748b;cursor:pointer;border-bottom:2.5px solid transparent}
    .tab.active{color:#0d1b3e;font-weight:700;border-bottom-color:#0d1b3e}
    .login-gate{background:linear-gradient(135deg,#0d1b3e,#1a3066);border-radius:12px;padding:24px;text-align:center;color:white}
  </style>
</head>
<body>

<div class="screen active" id="sLoad">
  <div class="load-logo">▲</div>
  <div class="load-name">WAYGO</div>
  <div class="load-sub" id="loadSub">Din taxi, direkt</div>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>

<div class="screen" id="sWelcome">
  <div style="text-align:center;margin-bottom:24px">
    <div style="font-size:56px;color:#fbbf24">▲</div>
    <div style="font-size:28px;font-weight:bold;color:#fbbf24;letter-spacing:3px">WAYGO</div>
  </div>
  <button class="btn btn-primary" onclick="startBooking('now')" style="margin-bottom:10px; height:80px;">Jag behöver en bil nu</button>
  <button class="btn btn-gray" onclick="startBooking('pre')" style="height:80px; background:#1a2f5e; color:white;">Jag vill förboka</button>
</div>

<div class="screen" id="sApp">
  <div class="topbar">
    <div class="tlogo" onclick="goWelcome()">▲ WAYGO</div>
    <div class="topbar-right">
      <button class="tlang" onclick="toggleLang()" id="langToggle">🇬🇧</button>
      <button class="tauth" id="topAuthBtn" onclick="alert('Logga in')">Logga in</button>
    </div>
  </div>
  <div style="flex:1;overflow-y:auto" id="tabContent"></div>
  <div class="bnav">
    <button class="bni active" id="bni0" onclick="showTab(0)"><span class="bni-icon">🚖</span><span>Boka</span></button>
    <button class="bni" id="bni1" onclick="showTab(1)"><span class="bni-icon">📋</span><span>Resor</span></button>
    <button class="bni" id="bni2" onclick="showTab(2)"><span class="bni-icon">👤</span><span>Profil</span></button>
    <button class="bni" id="bni3" onclick="showTab(3)"><span class="bni-icon">💳</span><span>Betalning</span></button>
  </div>
</div>

<script>
const API = 'https://16.16.153.106.sslip.io';
let customer = null;
let token = null;
let myBookings = [];
let currentTab = 0;
let lang = localStorage.getItem('waygo_lang') || 'sv';

const T = {
  sv: { active: 'Aktiva', history: 'Historik', no_history: 'Inga resor hittades', completed: 'Avslutad', pending: 'Väntar', assigned: 'Tilldelad', cancelled: 'Avbokad', incl_vat: 'Inkl. moms', login_gate_rides: 'Logga in för att se dina resor' },
  en: { active: 'Active', history: 'History', no_history: 'No rides found', completed: 'Completed', pending: 'Pending', assigned: 'Assigned', cancelled: 'Cancelled', incl_vat: 'Incl. VAT', login_gate_rides: 'Log in to see your rides' }
};

function t(k) { return T[lang][k] || k; }

// --- DIN NYA LOGIK FÖR HISTORIK ---

function renderHistoryTab() {
  if (!customer) return loginGate(t('login_gate_rides'));
  const active = myBookings.filter(b => ['pending','assigned'].includes(b.status));
  const past = myBookings.filter(b => ['cancelled','completed'].includes(b.status));
  return `
    <div class="tabbar" id="htabbar">
      <div class="tab active" id="htab0" onclick="switchHTab(0)">${t('active')} (${active.length})</div>
      <div class="tab" id="htab1" onclick="switchHTab(1)">${t('history')} (${past.length})</div>
    </div>
    <div id="histContent" class="page"></div>
    <div class="bspace"></div>`;
}

function switchHTab(i) {
  try {
    const tab0 = document.getElementById('htab0');
    const tab1 = document.getElementById('htab1');
    const content = document.getElementById('histContent');
    
    if (!tab0 || !tab1 || !content) return;

    const active = myBookings.filter(b => ['pending','assigned'].includes(b.status));
    const past = myBookings.filter(b => ['cancelled','completed'].includes(b.status));

    if (i === 0) {
      tab0.classList.add('active');
      tab1.classList.remove('active');
      content.innerHTML = renderActiveBookings(active);
    } else {
      tab1.classList.add('active');
      tab0.classList.remove('active');
      content.innerHTML = renderPastBookings(past);
    }
  } catch(e) { console.log('switchHTab error:', e); }
}

function showTab(i) {
  try {
    currentTab = i;
    document.querySelectorAll('.bni').forEach((b,j) => b.classList.toggle('active', i===j));
    const content = document.getElementById('tabContent');
    if (!content) return;
    
    if (i===0) {
      content.innerHTML = renderBookTab();
    } else if (i===1) {
      content.innerHTML = renderHistoryTab();
      loadMyBookings();
      setTimeout(() => switchHTab(0), 0);
    } else if (i===2) {
      content.innerHTML = renderProfileTab();
    } else if (i===3) {
      content.innerHTML = renderPaymentTab();
    }
    updateTopbar();
  } catch(e) { console.log('showTab error:', e); }
}

// --- HJÄLPFUNKTIONER ---

function renderActiveBookings(arr) {
  if (arr.length === 0) return `<div class="card" style="text-align:center">${t('no_history')}</div>`;
  return arr.map(b => renderBookingCard(b)).join('');
}

function renderPastBookings(arr) {
  if (arr.length === 0) return `<div class="card" style="text-align:center">${t('no_history')}</div>`;
  return arr.map(b => renderBookingCard(b)).join('');
}

function renderBookingCard(b) {
  return `
    <div class="hist-card">
      <div class="hist-top">
        <span class="hist-ref">#${b.id ? b.id.toString().slice(-6).toUpperCase() : 'WGO'}</span>
        <span class="badge ${b.status==='completed'?'b-green':b.status==='cancelled'?'b-red':'b-blue'}">${t(b.status)}</span>
      </div>
      <div class="hist-route">📍 ${b.pickup || '...'} <br> 🏁 ${b.destination || '...'}</div>
      <div style="font-size:11px; color:#64748b;">${b.date || ''} • ${b.time || ''}</div>
      <div style="margin-top:8px; font-weight:bold;">${b.price || '0'} SEK <span style="font-weight:normal; font-size:10px;">${t('incl_vat')}</span></div>
    </div>`;
}

function renderBookTab() {
  return `<div class="page"><div class="card"><div class="stitle">Boka Resa</div><input class="finput" placeholder="Från..."><input class="finput" placeholder="Till..."><button class="btn btn-primary">Sök Taxi</button></div></div>`;
}

function loginGate(msg) {
  return `<div class="page"><div class="login-gate"><h3>${msg}</h3><button class="btn btn-primary" style="margin-top:15px" onclick="alert('Logga in')">Logga in</button></div></div>`;
}

function loadMyBookings() {
  // Här skulle du normalt hämta från API. Vi simulerar tom array om inte inloggad.
  if(!customer) myBookings = [];
}

function updateTopbar() {
  const btn = document.getElementById('topAuthBtn');
  if(btn) btn.textContent = customer ? 'Logga ut' : 'Logga in';
}

function goWelcome() { showScreen('sWelcome'); }
function startBooking() { showScreen('sApp'); showTab(0); }
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

window.addEventListener('load', () => {
  setTimeout(() => showScreen('sWelcome'), 1500);
});

// Dummy funktioner för att undvika fel
function renderProfileTab() { return `<div class="page">Profil</div>`; }
function renderPaymentTab() { return `<div class="page">Betalning</div>`; }

</script>
</body>
</html>
